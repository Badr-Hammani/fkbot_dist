; ============================================================
; MetaTrader 5 Strategy Tester Configuration
; For use with: ICT_GoldTrader.mq5 and SMC_GoldTrader.mq5
; ============================================================

[Tester]
Expert=ICT_EA\ICT_GoldTrader
Symbol=XAUUSD
Period=M15
Deposit=10000
Currency=USD
Leverage=1:100
Model=1                    ; 1 = Every tick based on real ticks (most accurate)
; Model=2                  ; 2 = 1-minute OHLC (faster, use for initial sweep)
FromDate=2022.01.01
ToDate=2024.12.31
ForwardMode=1              ; 1 = half test period forward
ForwardDate=2024.01.01
Optimization=0             ; 0 = single run, 1 = complete optimization
OptimizationCriterion=6    ; 6 = Custom max (see OnTester())

; ---- Risk Parameters ----
Inp_RiskPct=1.0
Inp_MaxDailyLoss=3.0
Inp_MaxDrawdown=8.0
Inp_MaxOpenRisk=5.0
Inp_ATR_SL=1.2
Inp_ATR_TP1=2.0
Inp_ATR_TP2=4.0
Inp_BEtrigger=1.0
Inp_TrailATR=1.5
Inp_MaxSpread=35
Inp_MaxPositions=2

; ---- Sessions ----
Inp_AllowLondon=true
Inp_AllowNYOpen=true
Inp_AllowNYPM=false
Inp_GMToffset=0

; ---- News (disabled in backtest) ----
Inp_UseNewsFilter=false

; ---- Adaptive Learning ----
Inp_Adaptive=false         ; Disable in backtesting for reproducibility
Inp_MinConfidence=0.55
Inp_AdaptWindow=50

; ============================================================
; Optimization ranges (for batch parameter sweep)
; ============================================================
[Optimization]
Inp_RiskPct=0.5,0.1,2.0           ; min,step,max
Inp_ATR_SL=0.8,0.2,2.0
Inp_ATR_TP1=1.5,0.5,4.0
Inp_ATR_TP2=3.0,0.5,6.0
Inp_BEtrigger=0.8,0.2,2.0
Inp_TrailATR=1.0,0.5,3.0
Inp_MinConfidence=0.45,0.05,0.75
