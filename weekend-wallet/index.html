  function donutChartHtml(rows, byCat){
    var totalVal = rows.reduce(function(s, c){ return s + byCat[c.id]; }, 0);
    if(!totalVal) return "";

    var r = 38;
    var circ = 2 * Math.PI * r;
    var accum = 0;   /* fraction of circle already drawn */
    var gap = 0.012; /* tiny gap between segments as a fraction */

    var svg = '<svg width="105" height="105" viewBox="0 0 100 100" style="flex:none; transform: rotate(-90deg); display: block;">';
    svg += '<circle cx="50" cy="50" r="'+r+'" fill="transparent" stroke="var(--card2)" stroke-width="10"/>';

    rows.forEach(function(c){
      var pct = byCat[c.id] / totalVal;
      var segGap = rows.length > 1 ? gap : 0;
      var segFrac = Math.max(pct - segGap, 0.001);
      var strokeLen = segFrac * circ;
      /* dashoffset positions the start: SVG strokes draw from 3-o'clock;
         offset = circ - accum*circ shifts segment to the right place */
      var offset = circ * (1 - accum);

      svg += '<circle cx="50" cy="50" r="'+r+'" fill="transparent" ' +
             'stroke="var(' + c.v + ')" stroke-width="10" ' +
             'stroke-dasharray="' + strokeLen.toFixed(2) + ' ' + (circ - strokeLen).toFixed(2) + '" ' +
             'stroke-dashoffset="' + offset.toFixed(2) + '" ' +
             'stroke-linecap="butt"' +
             '/>';
      accum += pct;
    });
    svg += '</svg>';

    var container = '<div class="donut-container" style="position: relative; width: 105px; height: 105px; flex: none; margin: 4px 0;">' +
      svg +
      '<div style="position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; pointer-events: none;">' +
      '<span class="micro" style="font-size: 8px; color: var(--ink3); text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: -1px;">Spent</span>' +
      '<span class="money" style="font-weight: 800; font-size: 12px; color: var(--ink);">'+fmt(totalVal)+'</span>' +
      '</div></div>';

    return container;
  }

  function catBreakdown(list, title){
    if(!list.length) return "";
    var byCat = {};
    list.forEach(function(e){ byCat[e.cat] = (byCat[e.cat]||0) + e.amount; });
    var rows = CATS.filter(function(c){ return byCat[c.id]; })
      .sort(function(a,b){ return byCat[b.id]-byCat[a.id]; });
    if(!rows.length) return "";
    var max = byCat[rows[0].id];
    var h = '<div class="sec"><span class="micro">'+title+'</span></div>';
    
    h += '<div class="cat-breakdown" style="display:flex; align-items:center; gap:14px; background:var(--card); border:1px solid var(--line); border-radius:18px; padding:12px 14px;">';
    h += donutChartHtml(rows, byCat);
    h += '<div class="cats" style="flex:1; background:none; border:0; padding:0; margin:0; width:100%;">';
    rows.forEach(function(c){
      var v = byCat[c.id];
      h += '<div class="cat-row" style="padding: 7px 0;">' +
        '<span class="cat-name" style="color:var(--ink); font-size: 13px;"><span style="color:var('+c.v+'); display:inline-flex; vertical-align: -2px; margin-right: 4px;">'+catIcon(c.id)+'</span>'+c.name+'</span>' +
        '<span class="cat-bar" style="height: 6px;"><i style="width:'+(v/max*100).toFixed(1)+'%; background:var('+c.v+')"></i></span>' +
        '<span class="cat-amt money" style="font-size: 13px;">'+fmt(v)+'</span></div>';
    });
    h += '</div></div>';
    return h;
  }

  var openWk = null, openDay = null;
  var histMode = "days";
  function viewHistory(){
    var h = '<div class="sec"><span class="micro">History</span></div>' +
      '<div class="chips">' +
      '<button class="chip'+(histMode==="days"?" sel":"")+'" data-hist="days">'+IC.history+'Days</button>' +
      '<button class="chip'+(histMode==="weekends"?" sel":"")+'" data-hist="weekends">Weekends</button>' +
      '<button class="chip'+(histMode==="months"?" sel":"")+'" data-hist="months">Months</button></div>';
    return h + (histMode==="months" ? historyMonths()
              : histMode==="weekends" ? historyWeekends() : historyDays());
  }

  /* every day you ever logged — weekdays included, which the weekend and
     month views can't show you. Tap a day to open it. */
  function historyDays(){
    var groups = dayGroups(0);
    if(!groups.length){
      return emptyBox(IC.history, 'Every day you log shows up here —<br>weekday or weekend, all the way back.');
    }
    var spent = groups.reduce(function(s,g){ return s + Math.max(g.out,0); }, 0);
    var h = '<div class="stat-row">' +
      '<div class="stat"><span class="micro">Days</span><div class="v money">'+groups.length+'</div></div>' +
      '<div class="stat"><span class="micro">Avg a day</span><div class="v money">'+fmt(spent/groups.length)+'</div></div>' +
      '<div class="stat"><span class="micro">Biggest</span><div class="v money">'+
        fmt(Math.max.apply(null, groups.map(function(g){ return g.out; })))+'</div></div></div>';
    var mk = "";
    groups.forEach(function(g){
      var m = g.date.slice(0,7);
      if(m !== mk){
        mk = m;
        h += '<div class="sec"><span class="micro">'+fromIso(m+"-01").toLocaleDateString(undefined,{month:"long", year:"numeric"})+'</span>' +
          '<span class="micro money">'+fmt(monthSpent(m))+'</span></div>';
      }
      var open = openDay === g.date;
      h += '<div class="wk" data-day="'+g.date+'" role="button" tabindex="0" aria-expanded="'+open+'">' +
        '<div class="wk-top"><span class="wk-label">'+dayName(g.date)+'</span>' +
        '<span class="wk-amt money">'+dayTotalText(g.out)+'</span></div>' +
        '<div class="wk-sub">'+g.items.length+' entr'+(g.items.length===1?"y":"ies")+'</div>' +
        (open ? '<div class="wk-detail">'+g.items.map(dayRow).join("")+'</div>' : "") +
        '</div>';
    });
    return h;
  }

  /* what a month really cost you: what you spent, plus money you handed to
     people, minus what came back. Same arithmetic as the Home screen — these
     two must never disagree. */
  function monthOut(mk){
    var net = 0;
    ledgerItems().forEach(function(it){ if(it.date.slice(0,7) === mk) net += -it.cash; });
    return Math.round((monthSpent(mk) + net)*100)/100;
  }
  function monthGivenOut(mk){
    var out = 0;
    ledgerItems().forEach(function(it){ if(it.date.slice(0,7) === mk && it.cash < 0) out += -it.cash; });
    return Math.round(out*100)/100;
  }
  function monthMissing(mk){
    return total(state.expenses.filter(function(e){
      return e.cat === "missing" && e.date.slice(0,7) === mk;
    }));
  }

  function historyMonths(){
    var seen = {};
    state.expenses.forEach(function(e){ seen[e.date.slice(0,7)] = 1; });
    ledgerItems().forEach(function(it){ seen[it.date.slice(0,7)] = 1; });
    var keys = Object.keys(seen).sort().reverse();
    if(!keys.length){
      return emptyBox(IC.history, 'Every expense you log — weekday or weekend —<br>adds up here month by month.');
    }
    var thisMk = todayIso().slice(0,7);
    /* the plan only describes THIS month — applying it to old months would
       invent a "saving" out of months you barely logged */
    var spendable = state.salary > 0 ? Math.max(planMath().left, 0) : 0;
    var h = "";
    keys.forEach(function(k){
      var out = monthOut(k), now = k === thisMk;
      var n = state.expenses.filter(function(e){ return e.date.slice(0,7)===k; }).length;
      var label = fromIso(k+"-01").toLocaleDateString(undefined,{month:"long", year:"numeric"});
      var bits = [n+' expense'+(n===1?"":"s")];
      var given = monthGivenOut(k), miss = monthMissing(k);
      if(given > 0) bits.push('<span style="color:var(--bad)">'+fmt(given)+' given out</span>');
      if(miss > 0) bits.push('<span style="color:var(--c-missing)">'+fmt(miss)+' not logged</span>');

      h += '<div class="wk"><div class="wk-top">' +
        '<span class="wk-label">'+label+(now?' · now':'')+'</span>' +
        '<span class="wk-amt money">'+fmt(out)+'</span></div>' +
        '<div class="wk-sub">'+bits.join(' · ')+'</div>';

      if(now && spendable > 0){
        var left = Math.round((spendable - out)*100)/100;
        h += meterHtml(out, spendable) +
          '<div class="wk-sub">'+(left < 0
            ? '<span style="color:var(--bad); font-weight:700">'+fmt(-left)+' over</span> your '+fmt(spendable)+' plan'
            : '<b class="money">'+fmt(left)+'</b> left of your '+fmt(spendable)+' plan')+
          ' — <b>if you logged everything</b></div>' +
          '<button class="btn" id="m-cash" style="margin-top:10px">'+IC.wallet+'Not what\'s in your pocket? Check my cash</button>';
      }
      h += '</div>';
    });
    return h;
  }

  function weekendTrendChartHtml(keys, groups) {
    if (!keys || keys.length < 2) return "";
    var chartKeys = keys.slice(0, 5).reverse();
    var totals = chartKeys.map(function(k){ return total(groups[k]); });
    var max = Math.max.apply(null, totals) || 1;
    var avg = totals.reduce(function(a, b){ return a + b; }, 0) / totals.length;

    var n = chartKeys.length;
    /* dynamically space bars to fill the SVG width */
    var viewW = 200, padL = 10, padR = 10, innerW = viewW - padL - padR;
    var barW = Math.min(22, Math.floor(innerW / n * 0.55));
    var slot = innerW / n;

    var h = '<div class="panel" style="padding: 14px 12px 8px; margin-top: 12px;">' +
            '<h3 style="margin: 0 0 10px; font-size: 13px; color: var(--ink2); font-weight: 700; text-transform: uppercase; letter-spacing: .04em;">Weekend Trend</h3>';
    h += '<svg viewBox="0 0 200 82" style="width: 100%; height: 105px; overflow: visible; display: block;">';

    /* avg reference line */
    var avgY = 60 - Math.max((avg / max) * 50, 2);
    h += '<line x1="'+padL+'" y1="'+avgY.toFixed(1)+'" x2="'+(viewW-padR)+'" y2="'+avgY.toFixed(1)+'" ' +
         'stroke="var(--ink3)" stroke-dasharray="3 3" stroke-width="0.8"/>';
    h += '<text x="'+(viewW-padR+2)+'" y="'+(avgY+3).toFixed(1)+'" font-size="5.5" fill="var(--ink3)">avg</text>';

    /* baseline */
    h += '<line x1="'+padL+'" y1="60" x2="'+(viewW-padR)+'" y2="60" stroke="var(--line)" stroke-width="0.8"/>';

    chartKeys.forEach(function(k, idx){
      var t = totals[idx];
      var pct = t / max;
      var barH = Math.max(pct * 50, 3);
      var cx = padL + slot * idx + slot / 2;
      var x = cx - barW / 2;
      var y = 60 - barH;

      var plan = (state.wkPlan||{})[k] || 0;
      var isOver = plan > 0 && t > plan;
      var hasPlan = plan > 0;
      var color = isOver ? "var(--bad)" : hasPlan ? "var(--good)" : "var(--accent)";

      /* bar */
      h += '<rect x="'+x.toFixed(1)+'" y="'+y.toFixed(1)+'" width="'+barW+'" height="'+barH.toFixed(1)+'" rx="3.5" fill="'+color+'" opacity="0.9"/>';

      /* amount label above bar — use abbreviated fmt */
      var amtLabel = Math.round(t) >= 1000 ? (Math.round(t/100)/10)+'k' : Math.round(t)+'';
      h += '<text x="'+cx.toFixed(1)+'" y="'+(y - 3).toFixed(1)+'" text-anchor="middle" font-size="6.5" font-weight="800" fill="'+color+'">'+amtLabel+'</text>';

      /* date label below baseline */
      var f = fromIso(k);
      var lbl = String(f.getMonth()+1).padStart(2,"0") + "/" + String(f.getDate()).padStart(2,"0");
      h += '<text x="'+cx.toFixed(1)+'" y="69" text-anchor="middle" font-size="7" font-weight="600" fill="var(--ink2)">'+lbl+'</text>';

      /* plan indicator tick */
      if(hasPlan){
        var planY = 60 - Math.max((plan / max) * 50, 1);
        h += '<line x1="'+(x-1)+'" y1="'+planY.toFixed(1)+'" x2="'+(x+barW+1)+'" y2="'+planY.toFixed(1)+'" ' +
             'stroke="var(--ink3)" stroke-width="1" stroke-dasharray="2 1.5"/>';
      }
    });

    h += '</svg></div>';
    return h;
  }

  function historyWeekends(){
    var groups = {};
    state.expenses.forEach(function(e){
      var k = weekendKeyOf(e.date);
      if(!k) return;
      (groups[k] = groups[k]||[]).push(e);
    });
    var keys = Object.keys(groups).sort().reverse();

    if(!keys.length){
      return emptyBox(IC.wallet, 'Your weekend history will build up here —<br>totals, budgets and every receipt.');
    }

    var totals = keys.map(function(k){ return total(groups[k]); });
    var sum = totals.reduce(function(a,b){ return a+b; },0);
    /* share of that month's spending is a fact we actually have; "on budget"
       was scored against a number that was never real on those weekends */
    var mSum = 0, wSum = 0;
    keys.forEach(function(k){
      var mk = k.slice(0,7), m = monthSpent(mk);
      if(m > 0){ mSum += m; wSum += total(groups[k]); }
    });
    var share = mSum > 0 ? Math.round(wSum/mSum*100) : 0;
    var h = '<div class="stat-row">' +
      '<div class="stat"><span class="micro">Weekends</span><div class="v money">'+keys.length+'</div></div>' +
      '<div class="stat"><span class="micro">Avg spent</span><div class="v money">'+fmt(sum/keys.length)+'</div></div>' +
      '<div class="stat"><span class="micro">Of your spending</span><div class="v money">'+share+'%</div></div>' +
      '</div>';

    h += weekendTrendChartHtml(keys, groups);

    var avg = sum/keys.length;
    keys.forEach(function(k){
      var list = groups[k], t = total(list);
      var plan = (state.wkPlan||{})[k] || 0;
      var over = plan > 0 && t > plan;
      var sub = list.length+' expense'+(list.length===1?"":"s");
      if(plan > 0){
        sub += over
          ? ' · budget '+fmt(plan)+' · <span style="color:var(--bad); font-weight:700">'+fmt(t-plan)+' over</span>'
          : ' · budget '+fmt(plan)+' · <span style="color:var(--good); font-weight:700">'+fmt(plan-t)+' under</span>';
      }else{
        sub += ' · '+(t > avg
          ? '<span style="color:var(--ink2)">'+fmt(t-avg)+' above your average</span>'
          : '<span style="color:var(--ink2)">'+fmt(avg-t)+' below your average</span>');
      }
      h += '<div class="wk" data-wk="'+k+'" role="button" tabindex="0" aria-expanded="'+(openWk===k)+'"><div class="wk-top">' +
        '<span class="wk-label">'+weekendLabel(k, true)+(k===currentWeekend()?' · now':'')+'</span>' +
        '<span class="wk-amt money'+(over?" over":"")+'">'+fmt(t)+'</span></div>' +
        '<div class="wk-sub">'+sub+'</div>' +
        meterHtml(t, plan > 0 ? plan : Math.max(avg, 1)) +
        (openWk===k ? '<div class="wk-detail">' + list.slice().sort(function(a,b){return a.date<b.date?1:-1;}).map(expRow).join("") + '</div>' : "") +
        '</div>';
    });
    return h;
  }

  /* ---------- plan (salary, loan, subscriptions, goals) ---------- */
  function fridaysInMonth(){
    var now = new Date(), n = 0;
    var d = new Date(now.getFullYear(), now.getMonth(), 1);
    while(d.getMonth() === now.getMonth()){
      if(d.getDay() === 5) n++;
      d.setDate(d.getDate()+1);
    }
    return n;
  }
  /* a bill's plan is the usual monthly amount, but the month you actually pay
     it you can log a different figure — 2,770 on a 2,500 loan. From then on
     that month uses the real number, so the extra comes out of your spending
     money instead of quietly disappearing. */
  function monthKey(){ return todayIso().slice(0,7); }
  function paidRec(c, mk){ return (c.paid || {})[mk || monthKey()] || null; }
  function billFor(c, mk){
    var p = paidRec(c, mk);
    return p && p.amt > 0 ? p.amt : c.amount;
  }
  function payCommitment(c, amt){
    if(!c.paid) c.paid = {};
    var prev = paidRec(c);
    if(prev && c.kind === "loan") c.remaining = Math.round((c.remaining + prev.amt)*100)/100;
    c.paid[monthKey()] = { amt: Math.round(amt*100)/100, ts: Date.now() };
    if(c.kind === "loan") c.remaining = Math.max(Math.round((c.remaining - amt)*100)/100, 0);
  }
  function unpayCommitment(c){
    var p = paidRec(c);
    if(!p) return;
    if(c.kind === "loan") c.remaining = Math.round((c.remaining + p.amt)*100)/100;
    delete c.paid[monthKey()];
  }
  function planMath(){
    var bills = 0, planned = 0;
    state.commitments.forEach(function(c){ bills += billFor(c); planned += c.amount; });
    var savings = state.goals.reduce(function(s,g){ return s + (g.monthly||0); }, 0);
    return { bills: Math.round(bills*100)/100, planned: Math.round(planned*100)/100,
             extra: Math.round((bills - planned)*100)/100,
             savings: savings, left: Math.round((state.salary - bills - savings)*100)/100 };
  }
  function shortfallLoan(){
    var found = null;
    state.commitments.some(function(c){
      if(c.kind === "loan" && c.coverShortfall){ found = c; return true; }
      return false;
    });
    return found;
  }
  function moneyAvailableBeforeExpense(){
    var available = null;
    if(state.restAmount > 0 && state.restFrom) available = restRemaining();
    else if(state.salary > 0) available = planMath().left - monthSpent() - ledgerFlowSince(monthStartIso()).net;
    return available === null || !isFinite(available) ? null : Math.round(available*100)/100;
  }
  function adjustLoanRemaining(id, delta){
    if(!id || !delta) return null;
    var loan = null;
    state.commitments.forEach(function(c){ if(c.id === id && c.kind === "loan") loan = c; });
    if(!loan) return null;
    loan.remaining = Math.max(Math.round((+loan.remaining + delta)*100)/100, 0);
    return loan;
  }
  function applyExpenseShortfall(e){
    var loan = shortfallLoan();
    if(!loan) return { loan:null, amount:0 };
    var available = moneyAvailableBeforeExpense();
    if(available === null) return { loan:null, amount:0 };
    var amount = available > 0 ? Math.max(e.amount - available, 0) : e.amount;
    amount = Math.round(amount*100)/100;
    if(!(amount > 0)) return { loan:null, amount:0 };
    loan.remaining = Math.round((+loan.remaining + amount)*100)/100;
    e.loanId = loan.id;
    e.loanAdded = amount;
    return { loan:loan, amount:amount };
  }
  function daysLeftInMonth(){
    var now = new Date();
    var dim = new Date(now.getFullYear(), now.getMonth()+1, 0).getDate();
    return dim - now.getDate() + 1;   // includes today
  }
  function spentSince(dIso){
    return total(state.expenses.filter(function(e){ return e.date >= dIso; }));
  }
  /* The pool is anchored to a moment, not a day: set it at 6pm and the coffee
     you logged at 9am that same morning is already paid for, so it must not be
     subtracted again. Expenses before the anchor on the anchor day are out. */
  function poolStartTs(){
    if(!state.restFrom) return 0;
    return state.restTs > 0 ? state.restTs : fromIso(state.restFrom).getTime();
  }
  function spentFromPool(){
    var t = poolStartTs();
    return total(state.expenses.filter(function(e){
      if(e.date > state.restFrom) return true;
      return e.date === state.restFrom && (e.ts || 0) >= t;
    }));
  }
  /* real cash moved with people since a date: money you handed over (out)
     and money handed to you (in). Paying someone back empties your pocket
     just like buying something does. */
  /* Money coming back to you (someone repaying what they owed) is your own
     cash returning — it raises your budget. Money you *borrow* does not:
     it funds the amount you already said you'd have. That way planned
     borrowing can never be counted twice. */
  function classifyIncoming(balanceBefore, amt){
    var repay = balanceBefore < 0 ? Math.min(amt, -balanceBefore) : 0;
    return { repay: repay, borrow: Math.round((amt - repay)*100)/100 };
  }
  function ledgerFlowSince(dIso, fromTs){
    var t = fromTs > 0 ? fromTs : fromIso(dIso).getTime();
    var inn = 0, out = 0, borrowed = 0;
    state.debts.forEach(function(d){
      var bal = 0;
      (d.log||[]).forEach(function(l){
        if(l.dir === "b"){
          var c = classifyIncoming(bal, l.amt);
          bal += l.amt;
          if(l.ts >= t){ inn += c.repay; borrowed += c.borrow; }
        }else{
          bal -= l.amt;
          if(l.ts >= t) out += l.amt;
        }
      });
    });
    return { inn: Math.round(inn*100)/100, out: Math.round(out*100)/100,
             borrowed: Math.round(borrowed*100)/100,
             net: Math.round((out - inn)*100)/100 };
  }
  function monthStartIso(){
    var n = new Date();
    return iso(new Date(n.getFullYear(), n.getMonth(), 1));
  }
  /* every person-money movement, flattened and dated, so it can sit in the
     day list next to your expenses. cash = effect on your pocket that day. */
  function ledgerItems(){
    var out = [];
    state.debts.forEach(function(d){
      var bal = 0;
      (d.log||[]).forEach(function(l){
        var kind, cash;
        if(l.dir === "b"){
          var c = classifyIncoming(bal, l.amt);
          bal += l.amt;
          kind = c.repay <= 0 ? "borrowed" : c.repay >= l.amt ? "repaid" : "mixed";
          cash = c.repay;                       // borrowed money isn't yours to spend twice
        }else{
          bal -= l.amt;
          kind = "gave";
          cash = -l.amt;                        // out of your pocket, same as spending
        }
        out.push({ pid:d.id, name:d.name, amt:l.amt, dir:l.dir, kind:kind, cash:cash,
                   note:l.note||"", ts:l.ts, date: iso(new Date(l.ts)) });
      });
    });
    return out;
  }
  /* what's left of the money you set aside, after spending AND after money
     given to / received from people */
  function restRemaining(){
    if(!(state.restAmount > 0) || !state.restFrom) return null;
    var f = poolFlow();
    return Math.round((state.restAmount - spentFromPool() - f.net) * 100) / 100;
  }
  function poolFlow(){ return ledgerFlowSince(state.restFrom, poolStartTs()); }
  /* money left ÷ days left. Spending today doesn't move today's number
     (it recomputes tomorrow), but cash given or received counts right away. */
  /* ONE pool, split over the days you have left, with weekend days weighted
     heavier than weekdays. Every number on Home — today, this weekend, the
     month — comes out of this single function, so they cannot contradict
     each other the way a fixed weekend budget always eventually did. */
  function wkWeight(){
    var k = state.wkWeight > 0 ? state.wkWeight : 2;
    return Math.min(Math.max(k, 1), 3);
  }
  function isWeekendDay(dIso){ return weekendKeyOf(dIso) !== null; }
  function weekendDaysLeft(){
    var n = new Date(), dim = new Date(n.getFullYear(), n.getMonth()+1, 0).getDate(), c = 0;
    for(var d = n.getDate(); d <= dim; d++){
      if(isWeekendDay(iso(new Date(n.getFullYear(), n.getMonth(), d)))) c++;
    }
    return c;
  }
  /* money still to spend, ignoring today's own spending — today's number is
     fixed at midnight so it can't shrink under you as you use it */
  function poolLeftForRates(){
    if(state.restAmount > 0 && state.restFrom){
      return state.restAmount - (spentFromPool() - spentOn(todayIso())) - poolFlow().net;
    }
    if(state.salary > 0){
      return planMath().left - (monthSpent() - spentOn(todayIso())) - ledgerFlowSince(monthStartIso()).net;
    }
    return null;
  }
  function rateSplit(){
    var days = daysLeftInMonth();
    if(days <= 0) return null;
    var R = poolLeftForRates();
    if(R === null) return null;
    var we = weekendDaysLeft(), wd = days - we, k = wkWeight();
    var u = wd + k*we;
    if(u <= 0) return null;
    return { R:R, days:days, we:we, wd:wd, k:k,
             weekday: Math.max(Math.floor(R/u), 0),
             weekend: Math.max(Math.floor(k*R/u), 0) };
  }
  function autoDailyBudget(){
    var s = rateSplit();
    if(!s) return 0;
    return isWeekendDay(todayIso()) ? s.weekend : s.weekday;
  }
  /* The weekend's allowance is frozen the first time you open the app on or
     after its Friday. A live number could never read "over" — it would just
     keep shrinking — and it would rewrite your past weekends every time you
     spent. */
  function weekendPlan(fri, freeze){
    if(!state.wkPlan) state.wkPlan = {};
    if(state.wkPlan[fri] > 0) return state.wkPlan[fri];
    var s = rateSplit();
    if(!s) return 0;
    var v = Math.max(Math.round(s.weekend * 3), 0);
    if(freeze && v > 0 && todayIso() >= fri){ state.wkPlan[fri] = v; save(); }
    return v;
  }

  function todayBudget(){ return autoDailyBudget(); }

  function viewPlan(){
    var m = planMath();
    var monthName = new Date().toLocaleDateString(undefined, {month:"long", year:"numeric"});
    var h = '<div class="sec"><span class="micro">'+monthName+'</span></div>';

    if(!state.salary){
      h += emptyBox(IC.banknote, 'Add your salary below and I\'ll show how much is<br>left after your loan, subscriptions and savings.');
    }else{
      var nWk = fridaysInMonth();
      var perWk = m.left > 0 ? Math.floor(m.left / nWk) : 0;
      h += '<div class="flow">' +
        '<div class="flow-row"><span class="lbl">Salary</span><span class="val money">'+fmt(state.salary)+'</span></div>' +
        '<div class="flow-row minus"><span class="lbl">Loan & subscriptions</span><span class="val money">− '+fmt(m.bills)+'</span></div>' +
        '<div class="flow-row minus"><span class="lbl">Savings plan</span><span class="val money">− '+fmt(m.savings)+'</span></div>' +
        '<div class="flow-row flow-left"><span class="lbl">'+(m.left<0?"Over-committed":"Left to spend")+'</span>' +
        '<span class="val money'+(m.left<0?" neg":"")+'">'+fmt(Math.abs(m.left))+'</span></div>' +
        (m.left > 0 ?
          '<div class="suggest"><span class="txt">'+nWk+' weekends this month — that\'s about <b class="money">'+fmt(perWk)+'</b> each if you split it evenly.</span>' +
          '<button id="p-apply" data-amt="'+perWk+'">Use as budget</button></div>'
        : (m.left < 0 ?
          '<div class="suggest"><span class="txt">Your loan, subscriptions and savings add up to more than your salary. Trim something below.</span></div>' : "")) +
        '</div>';
    }

    h += '<div class="panel"><h3>'+IC.banknote+'Salary</h3><p>Your income each month.</p>' +
      '<div class="row2">' +
      '<div><label class="micro" for="p-salary" style="display:block; margin-bottom:6px">Monthly salary</label>' +
      '<input id="p-salary" type="text" inputmode="decimal" min="0" placeholder="e.g. 8000" value="'+(state.salary||"")+'"></div>' +
      '<div><label class="micro" for="p-payday" style="display:block; margin-bottom:6px">Payday (optional)</label>' +
      '<input id="p-payday" type="number" inputmode="numeric" min="1" max="31" placeholder="day, e.g. 28" value="'+(state.payday||"")+'"></div></div>' +
      '<button class="btn primary" id="p-salary-save">Save salary</button></div>';

    var autoD = autoDailyBudget();
    var rr = restRemaining();
    var freshFrom = state.restFrom && state.restFrom !== todayIso();
    h += '<div class="panel"><h3>'+IC.home+'Daily budget</h3>' +
      '<p>Forget the past. Tell me how much money you have from <b>today</b> until the end of the month — including whatever you plan to borrow — and I split it into a daily amount that shrinks itself as you spend.</p>' +
      '<div class="field"><label class="micro" for="p-rest" style="display:block; margin-bottom:6px">Money for the rest of the month</label>' +
      '<input id="p-rest" type="text" inputmode="decimal" min="0" placeholder="e.g. 1000" value="'+(state.restAmount||"")+'"></div>' +
      '<button class="btn primary" id="p-rest-save">Set daily budget</button>' +
      '<div style="height:9px"></div><button class="btn" id="p-cash">'+IC.wallet+'Check my cash</button>' +
      (rr !== null
        ? '<div class="hint">You can spend about <b class="money" style="color:var(--ink)">'+fmt(autoD)+'</b> a day — '+
          (rr<0? '<span style="color:var(--bad)">'+fmt(-rr)+' past your '+fmt(state.restAmount)+'</span>' : fmt(rr)+' left of '+fmt(state.restAmount))+
          ' over the '+daysLeftInMonth()+' days left'+(freshFrom? ', counting from '+fromIso(state.restFrom).toLocaleDateString(undefined,{month:"short",day:"numeric"}) : '')+'.'+
          (freshFrom? ' <button id="p-rest-reset" style="color:var(--accent-deep); font-weight:700; background:none; padding:0">Restart from today</button>' : '')+'</div>'
        : (autoD>0 ? '<div class="hint">Or I can spread your salary: about <b class="money">'+fmt(autoD)+'</b>/day for '+daysLeftInMonth()+' days.</div>' : '')) +
      '</div>';

    h += '<div class="sec"><span class="micro">Loan & subscriptions</span>' +
      '<span class="micro money">'+(state.commitments.length
        ? "− "+fmt(m.bills)+(m.extra? " this month" : " / mo") : "")+'</span></div>';
    if(state.commitments.length){
      h += '<div class="row-list">';
      state.commitments.forEach(function(c){
        var ord = c.due===1||c.due===21||c.due===31 ? "st" : c.due===2||c.due===22 ? "nd" : c.due===3||c.due===23 ? "rd" : "th";
        var sub1 = (c.kind==="loan"?"Loan":"Subscription") + (c.due? " · due the "+c.due+ord : "");
        var months = c.kind==="loan" && c.remaining > 0 ? Math.max(Math.ceil(c.remaining/c.amount),1) : 0;
        var p = paidRec(c), diff = p ? Math.round((p.amt - c.amount)*100)/100 : 0;
        var paidLine = p
          ? '<span class="subline hl money" style="color:'+(diff>0?"var(--bad)":"var(--good)")+'">'+IC.check+
            ' paid '+fmt(p.amt)+' this month'+(diff? ' · '+fmt(Math.abs(diff))+(diff>0? ' more' : ' less')+' than usual' : "")+'</span>'
          : "";
        h += '<button class="row-item" data-cm="'+esc(c.id)+'">' + kindTile(c.kind) +
          '<span class="name"><span class="ttl">'+esc(c.name)+'</span>' +
          '<span class="subline">'+sub1+'</span>' + paidLine +
          (c.coverShortfall ? '<span class="subline hl" style="color:var(--warn)">uncovered spending → this loan</span>' : "") +
          (months? '<span class="subline hl money">'+fmt(c.remaining)+' left · ≈ '+months+' month'+(months>1?"s":"")+' to go</span>' : "")+'</span>' +
          '<span class="amt money">'+fmt(c.amount)+' <small>/mo</small></span></button>';
      });
      h += '</div>';
    }else{
      h += emptyBox(IC.repeat, 'Your loan payment, Netflix, Spotify, gym…<br>everything that leaves your account monthly.');
    }
    h += '<button class="addrow" id="p-add-cm">+ Add loan or subscription</button>';

    /* friends & family ledger */
    var iOwe = iOweTotal(), owedMe = owedToMeTotal();
    var totals = [];
    if(iOwe > 0) totals.push('<span style="color:var(--bad)">you owe '+fmt(iOwe)+'</span>');
    if(owedMe > 0) totals.push('<span style="color:var(--good)">owed to you '+fmt(owedMe)+'</span>');
    h += '<div class="sec"><span class="micro">Friends & family</span>' +
      (totals.length? '<span class="micro money">'+totals.join(" · ")+'</span>' : "")+'</div>';
    if(state.debts.length){
      h += '<div class="row-list">';
      state.debts.forEach(function(d){
        var last = d.log && d.log.length ? d.log[d.log.length-1] : null;
        var sub = last
          ? (last.dir==="b" ? "they gave " : "you gave ")+fmt(last.amt)+
            (last.note? " · "+esc(last.note) : "")+" · "+new Date(last.ts).toLocaleDateString(undefined,{month:"short",day:"numeric"})
          : "no activity yet";
        var tint = d.balance > 0 ? "--bad" : d.balance < 0 ? "--good" : "--warn";
        h += '<button class="row-item" data-debt="'+esc(d.id)+'">' +
          '<span class="ic-tile" style="color:var('+tint+'); background:color-mix(in srgb, var('+tint+') 14%, var(--card2))">'+IC.person+'</span>' +
          '<span class="name"><span class="ttl">'+esc(d.name)+'</span>' +
          '<span class="subline">'+sub+'</span></span>' +
          '<span class="amt money" style="color:'+(d.balance>0?"var(--bad)":d.balance<0?"var(--good)":"var(--ink2)")+'">' +
          (d.balance<0? fmt(-d.balance) : fmt(d.balance))+
          '<br><small style="font-weight:600; color:var(--ink3)">'+(d.balance>0?"you owe":d.balance<0?"owes you":"settled")+'</small></span></button>';
      });
      h += '</div>';
    }else{
      h += emptyBox(IC.person, 'Lend a friend money, split a dinner, borrow from your dad —<br>keep every balance straight here.');
    }
    h += '<button class="addrow" id="p-add-split">+ Split a bill</button>' +
      '<button class="addrow" id="p-add-debt">+ Money in / out</button>';

    h += '<div class="sec"><span class="micro">Saving goals</span></div>';
    if(state.goals.length){
      state.goals.forEach(function(g){
        var pct = g.target > 0 ? Math.min(g.saved / g.target * 100, 100) : 0;
        var done = g.saved >= g.target && g.target > 0;
        h += '<div class="goal">' +
          '<div class="goal-top"><span class="goal-name">'+IC.target+esc(g.name)+'</span>' +
          '<span class="goal-amt money"><b>'+fmt(g.saved)+'</b> of '+fmt(g.target)+'</span></div>' +
          '<div class="meter-track"><div class="meter-fill'+(done?"":"")+'" style="width:'+pct.toFixed(1)+'%; '+(done?"background:var(--good)":"")+'"></div></div>' +
          '<div class="goal-foot"><span class="goal-pct'+(done?" done":"")+'">'+(done? "Goal reached!" : Math.round(pct)+"%"+(g.monthly? " · "+fmt(g.monthly)+"/mo planned":""))+'</span>' +
          '<span class="goal-actions">' +
          '<button class="mini-btn" data-goal-edit="'+esc(g.id)+'">Edit</button>' +
          '<button class="mini-btn primary" data-goal-add="'+esc(g.id)+'">Add money</button>' +
          '</span></div></div>';
      });
    }else{
      h += emptyBox(IC.target, 'A trip, a car, an emergency fund —<br>set a target and watch it fill up.');
    }
    h += '<button class="addrow" id="p-add-goal">+ New saving goal</button>';
    return h;
  }

  /* "this month I actually gave dad 2,770" — log the real figure without
     touching the plan, and the difference lands on your spending money. */
  function payBlock(c){
    var p = paidRec(c);
    var mName = new Date().toLocaleDateString(undefined,{month:"long"});
    if(p){
      var diff = Math.round((p.amt - c.amount)*100)/100;
      return '<div class="field"><div class="micro">Paid in '+mName+'</div>' +
        '<div class="flow-row" style="padding:6px 0"><span class="lbl">'+
        new Date(p.ts).toLocaleDateString(undefined,{month:"short",day:"numeric"})+
        (diff? ' · '+fmt(Math.abs(diff))+(diff>0? ' more' : ' less')+' than the usual '+fmt(c.amount) : ' · the usual amount')+
        '</span><span class="val money" style="color:var(--bad)">−'+fmt(p.amt)+'</span></div>' +
        '<button class="btn ghost" id="c-unpay" style="color:var(--ink2)">Undo this payment</button></div>';
    }
    return '<div class="field"><label class="micro" for="c-paid">Paid in '+mName+'? (optional)</label>' +
      '<input id="c-paid" type="text" inputmode="decimal" placeholder="'+c.amount+'" value="">' +
      '<button class="btn" id="c-pay" style="margin-top:8px">Log this month\'s payment</button>' +
      '<div class="hint">Some months you give more — put the real amount here and the difference comes off your spending money.</div></div>';
  }

  function openCommitmentSheet(id){
    var c = null;
    if(id){ state.commitments.forEach(function(x){ if(x.id===id) c = x; }); }
    var kind = c ? c.kind : "sub";
    openSheet(
      '<h2>'+(c? "Edit" : "Add loan or subscription")+'</h2>' +
      '<div class="field"><label class="micro" for="c-name">Name</label>' +
      '<input id="c-name" type="text" placeholder="Bank loan, Netflix…" maxlength="40" value="'+(c? esc(c.name):"")+'"></div>' +
      '<div class="micro" style="margin-bottom:8px">Type</div>' +
      '<div class="chips" id="c-kind">' +
      '<button class="chip'+(kind==="loan"?" sel":"")+'" data-kind="loan"><span style="color:var(--bad); display:inline-flex">'+IC.bank+'</span>Loan</button>' +
      '<button class="chip'+(kind==="sub"?" sel":"")+'" data-kind="sub"><span style="color:var(--c-drinks); display:inline-flex">'+IC.repeat+'</span>Subscription</button></div>' +
      '<div class="row2">' +
      '<div><label class="micro" for="c-amount" style="display:block; margin-bottom:6px">Monthly amount</label>' +
      '<input id="c-amount" type="text" inputmode="decimal" min="0" step="0.01" value="'+(c? c.amount:"")+'"></div>' +
      '<div><label class="micro" for="c-due" style="display:block; margin-bottom:6px">Due day (optional)</label>' +
      '<input id="c-due" type="number" inputmode="numeric" min="1" max="31" placeholder="e.g. 5" value="'+(c && c.due? c.due:"")+'"></div></div>' +
      '<div class="field" id="c-loanx" style="'+(kind==="loan"?"":"display:none")+'">' +
      '<label class="micro" for="c-remaining">Loan balance left (optional)</label>' +
      '<input id="c-remaining" type="text" inputmode="decimal" min="0" placeholder="How much is still owed" value="'+(c && c.remaining? c.remaining:"")+'">' +
      '<div class="hint">Each saved edit updates this — the app shows roughly how many months are left.</div>' +
      '<label class="checkrow" for="c-cover" style="margin-top:10px"><input type="checkbox" id="c-cover"'+(c && c.coverShortfall?" checked":"")+'>' +
      '<span><b>Cover spending shortfalls with this loan</b><br><span class="hint" style="display:block; margin-top:3px">When an expense is more than your available money, add only the missing amount to this loan.</span></span></label></div>' +
      (c? payBlock(c) : "") +
      '<button class="btn primary" id="c-save">Save</button>' +
      (c? '<div style="height:10px"></div><button class="btn danger" id="c-del">Remove</button>' : "")
    );
    var selKind = kind;
    $("#c-kind").addEventListener("click", function(ev){
      var b = ev.target.closest("[data-kind]"); if(!b) return;
      selKind = b.getAttribute("data-kind");
      var all = $("#c-kind").querySelectorAll(".chip");
      for(var i=0;i<all.length;i++) all[i].classList.toggle("sel", all[i]===b);
      $("#c-loanx").style.display = selKind==="loan" ? "" : "none";
    });
    $("#c-save").addEventListener("click", function(){
      var name = $("#c-name").value.trim();
      var amt = num($("#c-amount").value);
      var due = parseInt($("#c-due").value, 10);
      due = (due >= 1 && due <= 31) ? due : 0;
      var remaining = selKind==="loan" ? (num($("#c-remaining").value) || 0) : 0;
      var coverShortfall = selKind === "loan" && !!$("#c-cover").checked;
      if(!name){ toast("Give it a name"); return; }
      if(!(amt > 0)){ toast("Enter the monthly amount"); return; }
      if(c){ c.name = name; c.amount = Math.round(amt*100)/100; c.kind = selKind; c.due = due; c.remaining = remaining; c.coverShortfall = coverShortfall; }
      else state.commitments.push({ id: uid(), name: name, amount: Math.round(amt*100)/100, kind: selKind, due: due, remaining: remaining, coverShortfall: coverShortfall, paid: {} });
      save(); closeSheet(); render();
    });
    if(c && $("#c-pay")){
      $("#c-pay").addEventListener("click", function(){
        var amt = num($("#c-paid").value) || num($("#c-amount").value);
        if(!(amt > 0)){ toast("How much did you pay?"); return; }
        payCommitment(c, amt);
        save(); closeSheet(); render();
        var d = Math.round((amt - c.amount)*100)/100;
        toast(c.name+": "+fmt(amt)+" logged"+(d>0? " · "+fmt(d)+" more than usual" : d<0? " · "+fmt(-d)+" less than usual" : ""));
      });
    }
    if(c && $("#c-unpay")){
      $("#c-unpay").addEventListener("click", function(){
        unpayCommitment(c);
        save(); closeSheet(); render();
        toast(c.name+" payment removed");
      });
    }
    if(c){
      var armed = false;
      $("#c-del").addEventListener("click", function(){
        if(!armed){ armed = true; this.textContent = "Tap again to remove"; return; }
        state.commitments = state.commitments.filter(function(x){ return x.id!==c.id; });
        save(); closeSheet(); render();
      });
    }
  }

  function openGoalSheet(id){
    var g = null;
    if(id){ state.goals.forEach(function(x){ if(x.id===id) g = x; }); }
    openSheet(
      '<h2>'+(g? "Edit goal" : "New saving goal")+'</h2>' +
      '<div class="field"><label class="micro" for="g-name">What are you saving for?</label>' +
      '<input id="g-name" type="text" placeholder="Trip to Spain, new phone…" maxlength="40" value="'+(g? esc(g.name):"")+'"></div>' +
      '<div class="row2">' +
      '<div><label class="micro" for="g-target" style="display:block; margin-bottom:6px">Target</label>' +
      '<input id="g-target" type="text" inputmode="decimal" min="0" value="'+(g? g.target:"")+'"></div>' +
      '<div><label class="micro" for="g-monthly" style="display:block; margin-bottom:6px">Per month (optional)</label>' +
      '<input id="g-monthly" type="text" inputmode="decimal" min="0" placeholder="0" value="'+(g && g.monthly? g.monthly:"")+'"></div></div>' +
      '<p class="hint" style="margin:0 0 14px">The monthly amount is set aside in your plan before spending money is counted.</p>' +
      '<button class="btn primary" id="g-save">Save goal</button>' +
      (g? '<div style="height:10px"></div><button class="btn danger" id="g-del">Delete goal</button>' : "")
    );
    $("#g-save").addEventListener("click", function(){
      var name = $("#g-name").value.trim();
      var target = num($("#g-target").value);
      var monthly = num($("#g-monthly").value) || 0;
      if(!name){ toast("Give the goal a name"); return; }
      if(!(target > 0)){ toast("Set a target amount"); return; }
      if(g){ g.name = name; g.target = target; g.monthly = monthly; }
      else state.goals.push({ id: uid(), name: name, target: target, monthly: monthly, saved: 0 });
      save(); closeSheet(); render();
    });
    if(g){
      var armed = false;
      $("#g-del").addEventListener("click", function(){
        if(!armed){
          armed = true;
          /* say what is about to be thrown away — "Delete goal" gave no hint
             that thousands of saved dirhams went with it */
          this.textContent = g.saved > 0
            ? "Tap again — this drops "+fmt(g.saved)+" saved"
            : "Tap again to delete";
          return;
        }
        state.goals = state.goals.filter(function(x){ return x.id!==g.id; });
        save(); closeSheet(); render();
        toast(g.saved > 0 ? g.name+" deleted · "+fmt(g.saved)+" removed from savings" : g.name+" deleted");
      });
    }
  }

  function openGoalMoneySheet(id){
    var g = null;
    state.goals.forEach(function(x){ if(x.id===id) g = x; });
    if(!g) return;
    var remaining = Math.max(g.target - g.saved, 0);
    openSheet(
      '<h2>Add money — '+esc(g.name)+'</h2>' +
      '<p style="color:var(--ink2); font-size:13.5px; margin:0 0 14px">Saved so far: <b class="money">'+fmt(g.saved)+'</b>' +
      (remaining>0? ' · '+fmt(remaining)+' to go' : "")+'</p>' +
      '<div class="field"><input id="gm-amount" type="text" inputmode="decimal" min="0" step="0.01" placeholder="0" style="font-size:28px; font-weight:800; padding:14px 16px"></div>' +
      '<button class="btn primary" id="gm-save">Add to goal</button>'
    );
    $("#gm-save").addEventListener("click", function(){
      var amt = num($("#gm-amount").value);
      if(!(amt > 0)){ toast("Enter an amount"); return; }
      var room = Math.max(g.target - g.saved, 0);
      if(amt > room && room >= 0){
        /* don't quietly bank more than the goal needs */
        var over = Math.round((amt - room)*100)/100;
        g.saved = g.target;
        save(); closeSheet(); render();
        toast(room > 0 ? g.name+" is full — "+fmt(over)+" wasn't needed"
                       : g.name+" is already at its target");
        return;
      }
      g.saved = Math.round((g.saved + amt)*100)/100;
      save(); closeSheet(); render();
      toast(g.saved >= g.target ? "Goal reached — well done!" : fmt(amt)+" added to "+g.name);
    });
    setTimeout(function(){ var el = $("#gm-amount"); if(el) el.focus(); }, 350);
  }

  function viewSettings(){
    var curOpts = CURRENCIES.map(function(c){
      return '<option value="'+c.code+'"'+(state.currency===c.code?" selected":"")+'>'+c.label+'</option>';
    }).join("");
    var modelOpts = SCAN_MODELS.map(function(m){
      return '<option value="'+m.id+'"'+(state.scanModel===m.id?" selected":"")+'>'+m.label+'</option>';
    }).join("");
    return '' +
      '<div class="sec"><span class="micro">Settings</span></div>' +
      '<div class="panel"><h3>Weekends</h3><p>Your weekend number is worked out from the money you actually have left — it is not a fixed amount. This says how much heavier a weekend day is than a weekday.</p>' +
      '<div class="chips" id="s-wkw">' +
      [[1,'Same as a weekday'],[1.5,'A bit more'],[2,'Twice a weekday'],[3,'Three times']].map(function(o){
        return '<button class="chip'+(wkWeight()===o[0]?" sel":"")+'" data-wkw="'+o[0]+'">'+o[1]+'</button>';
      }).join("") + '</div>' +
      (rateSplit()? '<div class="hint">Right now that is about <b class="money">'+fmt(rateSplit().weekday)+'</b> a weekday and <b class="money">'+fmt(rateSplit().weekend)+'</b> a weekend day.</div>' : '') +
      '<div class="field" style="margin-top:12px"><label class="micro" for="s-currency">Currency</label><select id="s-currency">'+curOpts+'</select></div>' +
      '<button class="btn primary" id="s-save">Save changes</button></div>' +

      '<div class="panel"><h3>'+IC.sparkle+'Receipt scanning</h3>' +
      '<p>Receipts can be scanned <b>free on your phone</b> via local OCR. For much better accuracy (especially handwriting), configure a cloud API provider.</p>' +
      '<div class="field"><label class="micro" for="s-provider">Scan Provider</label>' +
      '<select id="s-provider">' +
      '<option value="free"'+(state.scanProvider==="free"?" selected":"")+'>Free (Local OCR)</option>' +
      '<option value="gemini"'+(state.scanProvider==="gemini"?" selected":"")+'>Gemini (Google AI Studio)</option>' +
      '<option value="claude"'+(state.scanProvider==="claude"?" selected":"")+'>Claude (Anthropic)</option>' +
      '</select></div>' +
      
      '<div class="field" id="s-gemini-key-container" style="'+(state.scanProvider==="gemini"?"":"display:none")+'">' +
      '<label class="micro" for="s-gemini-key">Gemini API Key</label>' +
      '<input id="s-gemini-key" type="password" placeholder="AIzaSy…" autocomplete="off" value="'+esc(state.geminiApiKey)+'"></div>' +
      
      '<div class="field" id="s-claude-key-container" style="'+(state.scanProvider==="claude"?"":"display:none")+'">' +
      '<label class="micro" for="s-claude-key">Claude API key</label>' +
      '<input id="s-claude-key" type="password" placeholder="sk-ant-…" autocomplete="off" value="'+esc(state.apiKey)+'"></div>' +
      
      '<div class="field" id="s-claude-model-container" style="'+(state.scanProvider==="claude"?"":"display:none")+'">' +
      '<label class="micro" for="s-model">Claude Model</label><select id="s-model">'+modelOpts+'</select></div>' +
      
      '<button class="btn" id="s-scan-save">Save scanning settings</button>' +
      '<div class="hint">Keys are stored only on this phone and never uploaded to any backend. Get a Gemini key for free at aistudio.google.com.</div></div>' +

      '<div class="panel"><h3>'+IC.share+'Put it on your home screen</h3>' +
      '<p>In Safari tap the <b>Share</b> button, then <b>Add to Home Screen</b>. Weekend Wallet opens full-screen like a normal app — your data stays on this phone.</p></div>' +

      '<div class="panel"><h3>'+IC.download+'Backup</h3><p>Your expenses live in this browser. Download a backup before switching phones.</p>' +
      '<button class="btn" id="s-export">Download backup file</button>' +
      '<div style="height:10px"></div>' +

      '<div class="panel"><h3>'+IC.trash+'Start fresh</h3><p>Deletes every expense and receipt photo. This can\'t be undone.</p>' +

      'Not seeing a new feature? Close the app fully and reopen it.</p>';
  }

  /* ---------- receipt scanning ---------- */
  var tesseractLoading = null;
  function loadTesseract(){
    if(window.Tesseract) return Promise.resolve();
    if(!tesseractLoading){
      tesseractLoading = new Promise(function(res, rej){
        var s = document.createElement("script");
        s.src = "https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js";
        s.onload = res;
        s.onerror = function(){ tesseractLoading = null; rej(new Error("ocr load failed")); };
        document.head.appendChild(s);
      });
    }
    return tesseractLoading;
  }
  var ocrWorker = null;
  function getOcrWorker(){
    return loadTesseract().then(function(){
      if(ocrWorker) return ocrWorker;
      return Tesseract.createWorker("eng").then(function(w){ ocrWorker = w; return w; });
    });
  }
  function rotatedDataUrl(img, deg){
    var w = img.naturalWidth || img.width, h = img.naturalHeight || img.height;
    var cv = document.createElement("canvas");
    if(deg === 180){ cv.width = w; cv.height = h; }
    else { cv.width = h; cv.height = w; }
    var ctx = cv.getContext("2d");
    ctx.translate(cv.width/2, cv.height/2);
    ctx.rotate(deg * Math.PI / 180);
    ctx.drawImage(img, -w/2, -h/2);
    return cv.toDataURL("image/jpeg", 0.8);
  }
  /* try upright first; if the text reads badly, retry the photo rotated —
     receipts photographed sideways are common */
  function scanWithTesseract(dataUrl){
    return new Promise(function(res, rej){
      var img = new Image();
      img.onload = function(){ res(img); };
      img.onerror = function(){ rej(new Error("bad image")); };
      img.src = dataUrl;
    }).then(function(img){
      return getOcrWorker().then(function(w){
        var angles = [0, 90, 270];
        var best = null;
        function better(a, b){
          if(!b) return true;
          if(!!a.amount !== !!b.amount) return !!a.amount;
          return (a.conf||0) > (b.conf||0);
        }
        function attempt(i){
          if(i >= angles.length) return best;
          var src = angles[i] === 0 ? dataUrl : rotatedDataUrl(img, angles[i]);
          return w.recognize(src).then(function(r){
            var parsed = ReceiptParse.parseReceiptText(r && r.data ? r.data.text : "");
            parsed.source = "ocr";
            parsed.conf = r && r.data ? (r.data.confidence || 0) : 0;
            if(better(parsed, best)) best = parsed;
            if(best.amount && best.conf >= 60) return best;   // confident — stop early
            return attempt(i+1);
          });
        }
        return attempt(0);
      });
    });
  }

  function scanWithClaude(dataUrl){
    var b64 = dataUrl.split(",")[1];
    var catIds = PICK_CATS.map(function(c){ return c.id; });
    return fetch("https://api.anthropic.com/v1/messages", {
      method: "POST",
      headers: {
        "content-type": "application/json",
        "x-api-key": state.apiKey,
        "anthropic-version": "2023-06-01",
        "anthropic-dangerous-direct-browser-access": "true"
      },
      body: JSON.stringify({
        model: state.scanModel || "claude-opus-4-8",
        max_tokens: 300,
        output_config: { format: { type: "json_schema", schema: {
          type: "object",
          properties: {
            amount:   { anyOf: [{type:"number"},{type:"null"}], description: "Final total paid, number only" },
            merchant: { anyOf: [{type:"string"},{type:"null"}], description: "Merchant / store name" },
            category: { type: "string", enum: catIds },
            date:     { anyOf: [{type:"string"},{type:"null"}], description: "Purchase date YYYY-MM-DD, null if unreadable" }
          },
          required: ["amount","merchant","category","date"],
          additionalProperties: false
        }}},
        messages: [{ role: "user", content: [
          { type: "image", source: { type: "base64", media_type: "image/jpeg", data: b64 } },
          { type: "text", text: "This is a photo of a receipt for a personal expense tracker. Extract the final total actually paid (after tax/tip), the merchant name, the purchase date, and pick the best category: food (restaurants, cafés, groceries), drinks (bars), out (entertainment, events), transport (taxi, fuel, parking), shop (retail, pharmacy), other. If it is not a receipt or the total is unreadable, set amount to null." }
        ]}]
      })
    }).then(function(resp){
      if(!resp.ok) return resp.json().catch(function(){ return {}; }).then(function(err){
        var msg = err && err.error && err.error.message ? err.error.message : ("API error " + resp.status);
        throw new Error(msg);
      });
      return resp.json();
    }).then(function(data){
      if(data.stop_reason === "refusal") throw new Error("Claude declined to read this image");
      var text = "";
      (data.content || []).forEach(function(b){ if(b.type === "text") text += b.text; });
      var parsed = JSON.parse(text);
      return {
        amount: (typeof parsed.amount === "number" && parsed.amount > 0) ? parsed.amount : null,
        merchant: parsed.merchant || null,
        date: /^\d{4}-\d{2}-\d{2}$/.test(parsed.date || "") ? parsed.date : null,
        category: CATS.some(function(c){ return c.id === parsed.category; }) ? parsed.category : null,
        source: "ai"
      };
    });
  }

  function scanWithGemini(dataUrl){
    var b64 = dataUrl.split(",")[1];
    var catIds = PICK_CATS.map(function(c){ return c.id; });
    var key = state.geminiApiKey;
    return fetch("https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=" + key, {
      method: "POST",
      headers: {
        "content-type": "application/json"
      },
      body: JSON.stringify({
        contents: [{
          parts: [
            { text: "This is a photo of a receipt for a personal expense tracker. Extract the final total actually paid (after tax/tip), the merchant name, the purchase date, and pick the best category. Return ONLY a JSON object with keys: amount (number or null), merchant (string or null), category (one of: food, drinks, out, transport, shop, other), date (string YYYY-MM-DD or null)." },
            { inlineData: { mimeType: "image/jpeg", data: b64 } }
          ]
        }],
        generationConfig: {
          responseMimeType: "application/json",
          responseSchema: {
            type: "OBJECT",
            properties: {
              amount: { type: "NUMBER", description: "Final total paid, number only" },
              merchant: { type: "STRING", description: "Merchant / store name" },
              category: { type: "STRING", enum: catIds },
              date: { type: "STRING", description: "Purchase date YYYY-MM-DD" }
            },
            required: ["amount", "merchant", "category", "date"]
          }
        }
      })
    }).then(function(resp){
      if(!resp.ok) return resp.json().catch(function(){ return {}; }).then(function(err){
        var msg = err && err.error && err.error.message ? err.error.message : ("Gemini API error " + resp.status);
        throw new Error(msg);
      });
      return resp.json();
    }).then(function(data){
      var text = "";
      if(data.candidates && data.candidates[0] && data.candidates[0].content && data.candidates[0].content.parts[0]){
        text = data.candidates[0].content.parts[0].text;
      }
      var parsed = JSON.parse(text.trim());
      return {
        amount: (typeof parsed.amount === "number" && parsed.amount > 0) ? parsed.amount : null,
        merchant: parsed.merchant || null,
        date: /^\d{4}-\d{2}-\d{2}$/.test(parsed.date || "") ? parsed.date : null,
        category: CATS.some(function(c){ return c.id === parsed.category; }) ? parsed.category : null,
        source: "gemini"
      };
    });
  }

  function scanReceipt(dataUrl){
    if(state.scanProvider === "gemini" && state.geminiApiKey){
      return scanWithGemini(dataUrl).catch(function(err){
        toast("Gemini scan failed — trying free scan");
        return scanWithTesseract(dataUrl);
      });
    }
    if(state.scanProvider === "claude" && state.apiKey){
      return scanWithClaude(dataUrl).catch(function(err){
        toast("Claude scan failed — trying free scan");
        return scanWithTesseract(dataUrl);
      });
    }
    return scanWithTesseract(dataUrl);
  }

  var scanRun = 0;
  function startScan(dataUrl){
    var run = ++scanRun;
    setPhotoUi("scanning");
    scanReceipt(dataUrl).then(function(r){
      if(run !== scanRun || !draft) return;   // sheet closed or newer photo taken
      var filled = [];
      var amountEl = $("#f-amount"), noteEl = $("#f-note"), dateEl = $("#f-date");
      if(r.amount && amountEl && !amountEl.value){
        amountEl.value = (Math.round(r.amount*100)/100);
        filled.push("amount");
      }
      if(r.merchant && noteEl && !noteEl.value){ noteEl.value = r.merchant; filled.push("store"); }
      if(r.date && dateEl){ dateEl.value = r.date; filled.push("date"); }
      if(r.category && !draft.catManual){ selectChip(r.category); }
      setPhotoUi("done");
      if(filled.length){
        toast((r.source==="ai" ? "Read by Claude" : "Scanned") + " — check the " + filled.join(", "));
        if(r.source==="ocr" && (r.conf||0) < 55){
          setTimeout(function(){
            if(draft) toast("Low confidence — double-check the amount");
          }, 3000);
        }
      }else{
        toast(state.apiKey ? "Couldn't read it — type the amount"
                           : "Couldn't read it — handwriting needs Claude scanning (Settings)");
      }
    }).catch(function(){
      if(run !== scanRun || !draft) return;
      setPhotoUi("done");
      toast(state.apiKey ? "Couldn't read the receipt — type the amount"
                         : "Couldn't read it — try Claude scanning in Settings");
    });
  }

  function setPhotoUi(mode){
    var ic = $("#f-photo-ic"), t = $("#f-photo-t"), s = $("#f-photo-s");
    if(!ic || !draft) return;
    var photo = safePhoto(draft.photo);
    if(photo) ic.innerHTML = '<img src="'+esc(photo)+'" alt="Receipt preview">';
    if(mode === "scanning"){
      t.innerHTML = 'Reading the receipt…';
      s.innerHTML = "";
      s.appendChild(document.createElement("span"));
      s.firstChild.className = "spin";
      s.firstChild.style.display = "inline-block";
    }else if(mode === "done"){
      t.textContent = "Receipt attached";
      s.textContent = "Tap to retake";
    }else{
      t.textContent = "Snap the receipt";
      s.textContent = state.apiKey ? "Claude reads it — even handwriting"
                                   : "Best on printed receipts — Claude scan reads handwriting";
    }
  }
  function selectChip(catId){
    if(!draft) return;
    draft.cat = catId;
    var all = sheet.querySelectorAll(".chip");
    for(var i=0;i<all.length;i++){
      all[i].classList.toggle("sel", all[i].getAttribute("data-cat")===catId);
    }
  }

  /* ---------- add / detail sheets ---------- */
  var sheet = $("#sheet"), backdrop = $("#backdrop"), camera = $("#camera");
  var draft = null, sheetReturnFocus = null, bodyOverflowBeforeSheet = "";

  function syncToggleSemantics(root){
    if(!root) return;
    root.querySelectorAll('.chip[data-cat], .chip[data-mode], .chip[data-spcat], .chip[data-kind], .chip[data-wkw], .chip[data-hist]').forEach(function(b){
      b.setAttribute("aria-pressed", b.classList.contains("sel") ? "true" : "false");
    });
    root.querySelectorAll("[data-tab]").forEach(function(b){
      if(b.classList.contains("active")) b.setAttribute("aria-current", "page");
      else b.removeAttribute("aria-current");
    });
  }

  sheet.addEventListener("click", function(){
    setTimeout(function(){ syncToggleSemantics(sheet); }, 0);
  });
  document.addEventListener("keydown", function(ev){
    if(!sheet.classList.contains("show")) return;
    if(ev.key === "Escape"){
      ev.preventDefault(); closeSheet(); return;
    }
    if(ev.key !== "Tab") return;
    var focusable = Array.prototype.slice.call(sheet.querySelectorAll('button:not([disabled]), input:not([disabled]), select:not([disabled]), textarea:not([disabled]), [tabindex]:not([tabindex="-1"])'));
    if(!focusable.length) return;
    var first = focusable[0], last = focusable[focusable.length-1];
    if(ev.shiftKey && document.activeElement === first){ ev.preventDefault(); last.focus(); }
    else if(!ev.shiftKey && document.activeElement === last){ ev.preventDefault(); first.focus(); }
  });

  /* ---- cash check -------------------------------------------------------
     You forget to log things. So instead of trusting the running total, count
     what you really have and let the app work backwards: the gap is money you
     spent without writing it down. It gets logged as a real expense under
     "Not logged", so every other number stays true. */
  /* Money the plan has already taken off your spending figure but that is
     probably still sitting in your account. Only bills whose due day is still
     ahead: one due the 3rd, unlogged, on the 18th has almost certainly gone
     out, and counting it would tell a broke user to log thousands as
     "missing". Savings count too — nothing here moves that money for you. */
  function setAside(){
    var today = new Date().getDate(), bills = 0;
    state.commitments.forEach(function(c){
      if(paidRec(c) || !c.due || c.due < today) return;
      bills += billFor(c);
    });
    var savings = state.goals.reduce(function(t,g){ return t + (g.monthly||0); }, 0);
    bills = Math.round(bills*100)/100; savings = Math.round(savings*100)/100;
    var parts = [];
    if(bills > 0) parts.push(fmt(bills)+' of bills not due yet');
    if(savings > 0) parts.push(fmt(savings)+' you plan to save');
    return { bills: bills, savings: savings, parts: parts,
             total: Math.round((bills + savings)*100)/100 };
  }
  /* what the app believes you can still spend */
  function appCash(){
    var rr = restRemaining();
    if(rr !== null) return rr;
    if(state.salary > 0){
      var pm = planMath();
      return Math.round((pm.left - monthSpent() - ledgerFlowSince(monthStartIso()).net)*100)/100;
    }
    return null;
  }
  function logMissing(amt){
    state.expenses.push({ id: uid(), ts: Date.now(), amount: Math.round(amt*100)/100,
                          cat: "missing", note: "Not logged", date: todayIso(), photo: null });
  }
  function missingThisMonth(){
    var mk = todayIso().slice(0,7);
    return total(state.expenses.filter(function(e){
      return e.cat === "missing" && e.date.slice(0,7) === mk;
    }));
  }

  function openCashSheet(){
    var expected = appCash();
    if(expected === null){
      openSheet('<h2>Check my cash</h2>' +
        '<p class="hint" style="margin-top:0">First tell the app what you\'re working with — your salary, or your money for the rest of the month. Then it can compare that against what\'s really in your pocket.</p>' +
        '<button class="btn primary" id="cash-plan">Open Plan</button>');
      $("#cash-plan").addEventListener("click", function(){ closeSheet(); tab = "plan"; render(); window.scrollTo(0,0); });
      return;
    }
    /* in pool mode the figure is one you typed yourself as "money I have", so
       there is nothing for the app to add back */
    var aside = restRemaining() === null ? setAside() : { total:0, parts:[] };
    var pend = aside.total;
    var last = state.cashTs ? new Date(state.cashTs) : null;
    openSheet(
      '<h2>Check my cash</h2>' +
      '<p class="hint" style="margin-top:0">Count what you have right now — pocket and bank. Whatever\'s missing gets logged as spending you forgot to write down.</p>' +
      '<div class="field"><label class="micro" for="cash-have">How much do you have?</label>' +
      '<input id="cash-have" type="text" inputmode="decimal" placeholder="e.g. '+Math.max(Math.round(expected),0)+'" autofocus></div>' +
      (pend > 0
        ? '<label class="checkrow" for="cash-pend"><input type="checkbox" id="cash-pend" checked>' +
          '<span>That money is still in my account — <b class="money">'+fmt(pend)+'</b> ('+
          aside.parts.join(' + ')+')</span></label>'
        : "") +
      '<div class="flow" id="cash-math" style="margin-top:14px"></div>' +
      '<button class="btn primary" id="cash-go" disabled>Enter an amount</button>' +
      (last? '<div class="hint">Last checked '+last.toLocaleDateString(undefined,{month:"short",day:"numeric"})+'.</div>' : "")
    );

    var inp = $("#cash-have"), go = $("#cash-go"), pendBox = $("#cash-pend");
    /* A mis-tap here writes a real entry into your history — typing 0 would log
       every last dirham as "Not logged". So a big difference takes two taps.
       "Big" has to be relative, because this runs in any currency: it's half or
       more of what the app expected. Everyday corrections stay one tap. */
    var BIG_SHARE = 0.5, armed = false;
    function target(){ return expected + (pendBox && pendBox.checked ? pend : 0); }
    function isBig(d){
      var t = target();
      return t > 0 && Math.abs(d) >= t * BIG_SHARE;
    }
    function diffNow(){
      var have = num(inp.value);
      if(!(have >= 0) || have > 1e9 || inp.value.trim() === "") return null;
      return Math.round((have - target())*100)/100;
    }
    function paint(){
      /* editing the amount or the checkbox cancels a confirm that was waiting,
         so a second tap can never commit a number you no longer see */
      armed = false;
      var t = target(), d = diffNow();
      inp.placeholder = "e.g. " + Math.max(Math.round(t), 0);

      /* header row always shows the expected amount */
      var rows = '<div class="flow-row"><span class="lbl">App says you have</span>' +
        '<span class="val money">'+fmt(t)+'</span></div>';

      if(d === null){
        $("#cash-math").innerHTML = rows;
        go.disabled = true; go.textContent = "Enter an amount";
        return;
      }

      var absD = Math.abs(d);
      var have = num(inp.value);
      var isGood = Math.abs(d) < 1;
      var isMissing = d < 0;
      var diffColor = isGood ? "var(--good)" : isMissing ? "var(--bad)" : "var(--accent-deep)";
      var diffLabel = isGood ? "Spot on" : isMissing ? "Missing" : "Extra";

      /* visual diff pill */
      rows += '<div style="margin:12px 0 8px; padding:12px 14px; border-radius:14px; ' +
              'background:color-mix(in srgb, '+diffColor+' 10%, var(--card2)); ' +
              'border:1px solid color-mix(in srgb, '+diffColor+' 22%, var(--line));">' +
              '<div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:'+(isGood?'0':'8px')+'">' +
              '<span style="font-size:13px; font-weight:700; color:'+diffColor+';">'+diffLabel+'</span>' +
              '<span class="money" style="font-size:17px; font-weight:900; color:'+diffColor+';">' +
              (isGood ? '✓' : (isMissing ? '−' : '+')) + (isGood ? '' : fmt(absD)) +
              '</span></div>';

      /* mini progress bar: you have / expected */
      if(!isGood && t > 0){
        var barPct = Math.min(have / t * 100, 100).toFixed(1);
        var extraPct = Math.max((have - t) / t * 100, 0).toFixed(1);
        rows += '<div style="height:6px; background:var(--line); border-radius:3px; overflow:hidden; position:relative;">' +
                '<div style="position:absolute; left:0; top:0; height:100%; width:'+barPct+'%; background:'+diffColor+'; border-radius:3px; transition:width .3s;"></div>' +
                (parseFloat(extraPct) > 0 ? '<div style="position:absolute; left:'+barPct+'%; top:0; height:100%; width:'+extraPct+'%; background:'+diffColor+'; opacity:0.35; border-radius:3px;"></div>' : '') +
                '</div>' +
                '<div style="display:flex; justify-content:space-between; margin-top:4px;">' +
                '<span style="font-size:10px; color:var(--ink3);">You have '+fmt(have)+'</span>' +
                '<span style="font-size:10px; color:var(--ink3);">Expected '+fmt(t)+'</span>' +
                '</div>';
      }
      rows += '</div>';

      $("#cash-math").innerHTML = rows;
      go.disabled = false;
      go.textContent = isGood ? "Looks right — nothing to log"
        : isMissing ? "Log "+fmt(absD)+" as spending I didn\u2019t track"
        : "Got it — "+fmt(absD)+" more than expected";
    }
    inp.addEventListener("input", paint);
    if(pendBox) pendBox.addEventListener("change", paint);
    paint();

    go.addEventListener("click", function(){
      var d = diffNow();
      if(d === null) return;
      if(!armed && Math.abs(d) >= 1 && isBig(d)){
        armed = true;
        this.textContent = d < 0 ? "Tap again to log " + fmt(-d)
                                 : "Tap again to add " + fmt(d);
        return;
      }
      state.cashTs = Date.now();
      if(Math.abs(d) < 1){
        save(); closeSheet(); render();
        toast("Nice — the app matches your pocket");
        return;
      }
      if(d < 0){
        logMissing(-d);
        save(); closeSheet(); render();
        toast(fmt(-d)+" logged as “Not logged”");
        return;
      }
      /* more than the app thought: add just the surplus to whatever pool we
         have, or start a fresh pool with the amount they typed */
      if(state.restAmount > 0 && state.restFrom){
        /* already in pool mode — just top it up by the difference */
        state.restAmount = Math.round((state.restAmount + d)*100)/100;
      }else if(state.salary > 0){
        /* salary mode: don't switch to pool mode; extra cash probably means
           a different account or cash-in-hand not tracked. Just tell them. */
        save(); closeSheet(); render();
        toast(fmt(d)+" more than expected — make sure it\u2019s not from another account");
        return;
      }else{
        /* no budget set at all: seed the pool from what they actually have */
        state.restAmount = Math.round((num(inp.value))*100)/100;
        state.restFrom = todayIso(); state.restTs = Date.now(); state.restAsk = "";
      }
      save(); closeSheet(); render();
      toast(fmt(d)+" more than expected · "+fmt(autoDailyBudget())+"/day");
    });
  }

  function openSheet(html){
    sheetReturnFocus = document.activeElement;
    bodyOverflowBeforeSheet = document.body.style.overflow;
    sheet.innerHTML = '<div class="grab"></div><button class="sheet-x" aria-label="Close">✕</button>' + html;
    var title = sheet.querySelector("h2");
    if(title){ title.id = "sheet-title"; sheet.setAttribute("aria-labelledby", "sheet-title"); }
    else { sheet.removeAttribute("aria-labelledby"); sheet.setAttribute("aria-label", "Dialog"); }
    sheet.setAttribute("aria-hidden", "false");
    backdrop.setAttribute("aria-hidden", "false");
    shell.setAttribute("aria-hidden", "true");
    if("inert" in shell) shell.inert = true;
    document.body.style.overflow = "hidden";
    syncToggleSemantics(sheet);
    sheet.querySelector(".sheet-x").addEventListener("click", closeSheet);
    backdrop.classList.add("show");

  function saveDraft(){
    var amt = num($("#f-amount").value);
    if(!(amt > 0)){ toast("Enter the amount first"); $("#f-amount").focus(); return; }
    if(draft.editId){
      var ex = null;
      state.expenses.forEach(function(x){ if(x.id===draft.editId) ex = x; });
      if(ex){
        var old = { amount:ex.amount, cat:ex.cat, note:ex.note, date:ex.date,
                    photo:ex.photo, loanId:ex.loanId, loanAdded:ex.loanAdded };
        var pos = state.expenses.indexOf(ex);
        if(pos > -1) state.expenses.splice(pos, 1);
        if(old.loanAdded > 0) adjustLoanRemaining(old.loanId, -old.loanAdded);
        ex.amount = Math.round(amt*100)/100;
        ex.cat = draft.cat;
        ex.note = $("#f-note").value.trim();
        ex.date = $("#f-date").value || ex.date;
        ex.photo = draft.photo;
        ex.loanId = "";
        ex.loanAdded = 0;
        var coverage = applyExpenseShortfall(ex);
        if(pos > -1) state.expenses.splice(pos, 0, ex);
        if(save({retryWithoutPhoto:ex})){
          toast(coverage.amount > 0
            ? "Updated · "+fmt(coverage.amount)+" added to "+coverage.loan.name+" loan"
            : "Updated");
        }else{
          if(coverage.amount > 0) adjustLoanRemaining(coverage.loan.id, -coverage.amount);
          ex.amount = old.amount; ex.cat = old.cat; ex.note = old.note; ex.date = old.date;
          ex.photo = old.photo; ex.loanId = old.loanId; ex.loanAdded = old.loanAdded;
          if(old.loanAdded > 0) adjustLoanRemaining(old.loanId, old.loanAdded);
        }
      }
      closeSheet(); render();
      return;
    }
    var e = {
      id: uid(), ts: Date.now(),
      amount: Math.round(amt*100)/100,
      cat: draft.cat,
      note: $("#f-note").value.trim(),
      date: $("#f-date").value || todayIso(),
      photo: draft.photo,
      loanId: "",
      loanAdded: 0
    };
    state.lastCat = e.cat;
    var coverage = applyExpenseShortfall(e);
    state.expenses.push(e);
    if(save({retryWithoutPhoto:e})){
      var wk = weekendKeyOf(e.date);
      var added = wk ? (isLiveWeekend(wk) ? "Added to this weekend — "+fmt(e.amount)
                                         : "Added to the "+weekendLabel(wk)+" weekend")
                     : "Added — "+fmt(e.amount);
      toast(coverage.amount > 0
        ? added+" · "+fmt(coverage.amount)+" added to "+coverage.loan.name+" loan"
        : added);
    } else {
      if(coverage.amount > 0) adjustLoanRemaining(coverage.loan.id, -coverage.amount);
      state.expenses.pop();
    }
    closeSheet(); render();
  }

  camera.addEventListener("change", function(){
    var f = camera.files && camera.files[0];
    camera.value = "";
    if(!f || !draft) return;
    var t = $("#f-photo-t"); if(t) t.textContent = "Processing photo…";
    var img = new Image();
    var url = URL.createObjectURL(f);
    img.onload = function(){
      var MAX = 1100;   // keep text readable for the scanner, still small enough to store
      var sc = Math.min(1, MAX / Math.max(img.width, img.height));
      var cv = document.createElement("canvas");
      cv.width = Math.round(img.width*sc); cv.height = Math.round(img.height*sc);
      cv.getContext("2d").drawImage(img, 0, 0, cv.width, cv.height);
      var scanUrl = cv.toDataURL("image/jpeg", 0.8);   // higher quality for reading
      URL.revokeObjectURL(url);
      if(!draft) return;
      // store a smaller copy with the expense
      var sc2 = Math.min(1, 720 / Math.max(cv.width, cv.height));
      var cv2 = document.createElement("canvas");
      cv2.width = Math.round(cv.width*sc2); cv2.height = Math.round(cv.height*sc2);
      cv2.getContext("2d").drawImage(cv, 0, 0, cv2.width, cv2.height);
      draft.photo = cv2.toDataURL("image/jpeg", 0.55);
      startScan(scanUrl);
    };
    img.onerror = function(){ URL.revokeObjectURL(url); toast("Couldn't read that photo"); setPhotoUi("idle"); };
    img.src = url;
  });

      $("#s-import-file").addEventListener("change", function(){
        var f = this.files && this.files[0]; this.value = "";
        if(!f) return;
        var r = new FileReader();
        r.onload = function(){
          var prev = null;
          try{
            var d = JSON.parse(r.result);
            if(!d || !Array.isArray(d.expenses)) throw 0;
            var hasData = state.expenses.length || state.commitments.length || state.goals.length || state.debts.length;
            if(hasData && !window.confirm("Restore this backup and replace the current money data on this device?")) return;
            prev = state;
            state = { setup:true, budget:+d.budget||0, currency:d.currency||"USD",

                      scanProvider:d.scanProvider||state.scanProvider,

                      commitments:Array.isArray(d.commitments)? d.commitments : [],
                      goals:Array.isArray(d.goals)? d.goals : [],

                      wkPlan:(d.wkPlan && typeof d.wkPlan==="object")? d.wkPlan : {},
                      wkWeight:+d.wkWeight||2 };
            cleanRows();
            retireStalePool(state);
            /* draw BEFORE writing: a backup with one bad row used to be saved
               and then throw on render, leaving a white screen that survived
               every reload */
            render();
            save();
            toast("Backup restored — "+state.expenses.length+" expenses");
          }catch(e){
            if(prev){ state = prev; try{ render(); }catch(e2){} }
            toast("That file isn't a Weekend Wallet backup");

        };
        r.readAsText(f);

      var wipeArmed = false;
      $("#s-wipe").addEventListener("click", function(){
        if(!wipeArmed){ wipeArmed = true; this.textContent = "Tap again to erase everything"; return; }
        if(!window.confirm("Erase every expense, receipt photo, loan, goal, and setting from this device?")){
          wipeArmed = false; this.textContent = "Erase all data"; return;
        }
        state = { setup:false, budget:0, currency:state.currency, expenses:[], apiKey:"", geminiApiKey:"", scanProvider:"free", scanModel:"claude-opus-4-8",
                  salary:0, commitments:[], goals:[], swept:{}, payday:0, debts:[], restAmount:0, restFrom:"", restTs:0, cashTs:0, wkPlan:{}, wkWeight:2 };
        try{ localStorage.removeItem(KEY); }catch(e){}
        render();
      });
    }
  }

  render();

  /* ---------- auto-update check ---------- */
  var lastUpdateCheck = 0;
  function checkForUpdate(){
    var now = Date.now();
    if(now - lastUpdateCheck < 5*60*1000) return;
    lastUpdateCheck = now;
    fetch("version.json?t=" + now, { cache: "no-store" })
      .then(function(r){ return r.json(); })
      .then(function(j){
        if(j && j.version && j.version !== APP_VERSION){
          document.getElementById("updatebar").classList.add("show");
        }
      })
      .catch(function(){});
  }
  document.getElementById("updatebar-go").addEventListener("click", function(){
    location.replace(location.pathname + "?u=" + Date.now());
  });
  checkForUpdate();
  document.addEventListener("visibilitychange", function(){
    if(document.visibilityState === "visible") checkForUpdate();
  });

  /* register service worker for offline PWA support */
  if("serviceWorker" in navigator){
    window.addEventListener("load", function(){
      navigator.serviceWorker.register("sw.js").catch(function(){});
    });
  }

  /* gentle backup reminder — data only lives on this phone */
  setTimeout(function(){
    var TWO_WEEKS = 14*24*3600*1000;
    var last = Math.max(state.backupTs, state.nudgedAt);
    if(state.setup && state.expenses.length >= 10 && Date.now() - last > TWO_WEEKS){
      state.nudgedAt = Date.now();
      save();
      toastAction("Protect your data — download a backup", "Go", function(){
        tab = "settings"; render(); window.scrollTo(0, 0);
      }, 8000);
    }
  }, 2500);
})();
</script>
</body>
</html>
