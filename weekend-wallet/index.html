<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Weekend Wallet</title>
<meta name="theme-color" content="#17152a" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#f7f5f0" media="(prefers-color-scheme: light)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-180.png">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Weekend">
<style>
  :root{
    color-scheme: light;
    --bg:#f7f5f0; --card:#ffffff; --card2:#f1eee6; --line:#e5e1d5;
    --ink:#232030; --ink2:#6b6880; --ink3:#6f6b78;
    --accent:#e89e24; --accent-deep:#8a5a00; --on-accent:#241b08;
    --good:#006300; --warn:#b97900; --bad:#d03b3b;
    --c-food:#eda100; --c-drinks:#2a78d6; --c-out:#4a3aa7;
    --c-transport:#1baf7a; --c-shop:#e34948; --c-other:#008300; --c-missing:#7a7391;
    --shadow:0 10px 30px rgba(35,32,48,.12);
    --sheet-shadow:0 -18px 50px rgba(35,32,48,.22);
  }
  @media (prefers-color-scheme: dark){
    :root{
      color-scheme: dark;
      --bg:#17152a; --card:#232135; --card2:#2b2946; --line:#37344f;
      --ink:#f2f0fa; --ink2:#a6a2bc; --ink3:#a19db6;
      --accent:#f2a93b; --accent-deep:#f2a93b; --on-accent:#241b08;
      --good:#0ca30c; --warn:#fab219; --bad:#e66767;
      --c-food:#c98500; --c-drinks:#3987e5; --c-out:#9085e9;
      --c-transport:#199e70; --c-shop:#e66767; --c-other:#008300; --c-missing:#9a92b4;
      --shadow:0 10px 30px rgba(0,0,0,.4);
      --sheet-shadow:0 -18px 50px rgba(0,0,0,.55);
    }
  }

  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
  html,body{margin:0; padding:0}
  body{
    background:var(--bg); color:var(--ink);
    font-family:-apple-system, "SF Pro Text", system-ui, "Segoe UI", Roboto, sans-serif;
    font-size:16px; line-height:1.45;
    min-height:100dvh;
    padding-top:env(safe-area-inset-top);
  }
  button{font:inherit; color:inherit; background:none; border:0; padding:0; cursor:pointer}
  button:focus-visible, a:focus-visible, input:focus-visible, select:focus-visible{
    outline:2px solid var(--accent); outline-offset:2px; border-radius:6px;
  }
  input, select{
    font:inherit; color:var(--ink); background:var(--card2);
    border:1px solid var(--line); border-radius:12px; padding:12px 14px; width:100%;
  }
  ::placeholder{color:var(--ink3)}

  #shell{max-width:480px; margin:0 auto; padding:0 16px 120px; min-height:100dvh}

  .topbar{display:flex; align-items:center; justify-content:space-between; padding:20px 2px 6px}
  .brand{display:flex; align-items:center; gap:10px}
  .brand-mark{
    width:34px; height:34px; border-radius:11px; background:var(--accent);
    display:grid; place-items:center; color:var(--on-accent); font-weight:800; font-size:15px;
  }
  .brand-name{font-weight:800; letter-spacing:-.02em; font-size:17px}
  .brand-sub{font-size:11px; color:var(--ink2); text-transform:uppercase; letter-spacing:.12em; margin-top:1px}

  .micro{font-size:11px; text-transform:uppercase; letter-spacing:.12em; color:var(--ink2); font-weight:600}
  .money{font-variant-numeric:tabular-nums}

  .hero{
    background:var(--card); border:1px solid var(--line); border-radius:22px;
    padding:22px 20px 18px; margin-top:12px; box-shadow:var(--shadow);
    position:relative; overflow:hidden;
  }
  .hero::before{
    content:""; position:absolute; top:-70px; right:-70px; width:220px; height:220px;
    border-radius:50%; pointer-events:none;
    background:radial-gradient(circle, color-mix(in srgb, var(--accent) 22%, transparent) 0%, transparent 68%);
  }
  .hero > *{position:relative}
  .hero-top{display:flex; justify-content:space-between; align-items:baseline; gap:8px}
  .hero-when{font-weight:700; font-size:15px}
  .hero-live{display:inline-flex; align-items:center; gap:6px; font-size:12px; font-weight:700; color:var(--accent-deep)}
  .hero-live .dot{width:7px; height:7px; border-radius:50%; background:var(--accent); animation:pulse 1.6s ease-in-out infinite}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
  @media (prefers-reduced-motion: reduce){ .hero-live .dot{animation:none} .spin{animation:none} }
  .hero-amount{
    font-size:clamp(44px, 14vw, 62px); font-weight:800; letter-spacing:-.03em; line-height:1.05;
    margin:10px 0 2px; text-wrap:balance;
  }
  .hero-amount.over{color:var(--bad)}
  .hero-caption{color:var(--ink2); font-size:14px}
  .hero-caption strong{color:var(--ink); font-weight:700}

  .meter{margin-top:16px}
  .meter-track{height:12px; border-radius:6px; background:var(--card2); overflow:hidden; display:flex}
  .meter-fill{height:100%; border-radius:6px; background:var(--accent); min-width:4px; transition:width .4s ease}
  .meter-fill.warn{background:var(--warn)}
  .meter-fill.over{background:var(--bad)}
  .meter-row{display:flex; justify-content:space-between; margin-top:8px; font-size:13px; color:var(--ink2)}

  .sec{display:flex; align-items:baseline; justify-content:space-between; margin:26px 2px 10px}
  .sec .micro{color:var(--ink3)}

  .cats{background:var(--card); border:1px solid var(--line); border-radius:18px; padding:6px 16px}
  .cat-row{display:grid; grid-template-columns:110px 1fr auto; gap:12px; align-items:center; padding:11px 0; border-bottom:1px solid var(--line)}
  .cat-row > *{min-width:0}
  .cat-row:last-child{border-bottom:0}
  .cat-name{display:flex; align-items:center; gap:8px; font-size:14px; font-weight:600}
  .cat-name{min-width:0}
  .cat-dot{width:10px; height:10px; border-radius:4px; flex:none}
  .cat-bar{height:8px; border-radius:4px; background:var(--card2); overflow:hidden}
  .cat-bar i{display:block; height:100%; border-radius:4px; min-width:3px}
  .cat-amt{font-size:14px; font-weight:700}

  .daygroup{margin-top:14px}
  .dayhead{display:flex; justify-content:space-between; align-items:baseline; padding:0 4px 8px}
  .dayhead .total{font-size:13px; color:var(--ink2); font-weight:600}
  .exp-list{background:var(--card); border:1px solid var(--line); border-radius:18px; overflow:hidden}
  .exp{
    display:flex; align-items:center; gap:12px; width:100%; text-align:left;
    padding:12px 14px; border-bottom:1px solid var(--line);
  }
  .exp:last-child{border-bottom:0}
  .exp:active{background:var(--card2)}
  .exp-thumb{
    width:44px; height:44px; border-radius:12px; flex:none; overflow:hidden;
    background:var(--card2); display:grid; place-items:center;
  }
  .exp-thumb img{width:100%; height:100%; object-fit:cover; display:block}
  .exp-thumb svg{width:21px; height:21px}
  .ic-tile{
    width:40px; height:40px; border-radius:12px; flex:none;
    display:grid; place-items:center;
  }
  .ic-tile svg{width:19px; height:19px}
  .chip svg{width:14px; height:14px; flex:none}
  .linkish{background:none; border:0; padding:0; font:inherit; font-size:12.5px; font-weight:700;
    letter-spacing:.02em; color:var(--accent-deep); text-transform:none}
  .subline svg{width:13px; height:13px; vertical-align:-2px; margin-right:4px}
  .cat-name svg{width:15px; height:15px; flex:none}
  .goal-name svg{width:15px; height:15px; vertical-align:-2px; margin-right:5px; color:var(--accent-deep)}
  .panel h3 svg{width:16px; height:16px; vertical-align:-2.5px; margin-right:7px; color:var(--accent-deep)}
  .empty svg{width:30px; height:30px; color:var(--ink3); display:block; margin:0 auto 10px}
  .qamts{display:flex; gap:8px; margin:-4px 0 14px}
  .qamts button{
    flex:1; padding:9px 0; border-radius:11px; background:var(--card2);
    border:1px solid var(--line); font-weight:700; font-size:14px;
    font-variant-numeric:tabular-nums;
  }
  .qamts button:active{background:color-mix(in srgb, var(--accent) 18%, var(--card2))}
  .qa-grid{display:grid; grid-template-columns:1fr 1fr; gap:10px}
  .qa-wide{grid-column:1/-1}
  .checkrow{display:flex; align-items:flex-start; gap:10px; padding:11px 13px; border-radius:14px;
    background:var(--card2); border:1px solid var(--line); font-size:14px; color:var(--ink2); line-height:1.4}
  .checkrow input{width:19px; height:19px; flex:none; margin:1px 0 0; accent-color:var(--accent-deep)}
  .qa-tile{
    background:var(--card2); border:1px solid var(--line); border-radius:18px;
    padding:20px 12px 16px; display:flex; flex-direction:column; align-items:center; gap:9px;
    font-weight:700; font-size:14px; color:var(--ink);
  }
  .qa-tile svg{width:27px; height:27px; color:var(--accent-deep)}
  .qa-tile:active{transform:scale(.96); background:color-mix(in srgb, var(--accent) 12%, var(--card2))}
  .task{display:flex; align-items:center; gap:12px; width:100%; text-align:left; padding:13px 14px; border-bottom:1px solid var(--line)}
  .task:last-child{border-bottom:0}
  .task:active{background:var(--card2)}
  .task svg{width:21px; height:21px; flex:none}
  .task .tx{flex:1; font-weight:600; font-size:14.5px}
  .task.done .tx{color:var(--ink3); text-decoration:line-through}
  .task.done svg:first-child{color:var(--good)}
  .task:not(.done) svg:first-child{color:var(--accent-deep)}
  .task .go{color:var(--ink3); width:17px; height:17px}
  .share-row{display:flex; align-items:center; gap:12px; margin-bottom:8px}
  .share-row .nm{flex:1; font-weight:600; font-size:14.5px; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
  .share-row input{width:120px; flex:none; padding:10px 12px}
  .btn.ghost{background:transparent}
  .exp-main{flex:1; min-width:0}
  .exp-title{font-weight:600; font-size:15px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
  .exp-sub{font-size:12.5px; color:var(--ink2); display:flex; align-items:center; gap:6px}
  .exp-sub .cat-dot{width:7px; height:7px; border-radius:3px}
  .exp-amt{font-weight:700; font-size:15px; flex:none}

  .empty{
    background:var(--card); border:1px dashed var(--line); border-radius:18px;
    padding:28px 20px; text-align:center; color:var(--ink2); font-size:14.5px;
  }
  .empty b{color:var(--ink)}

  .stat-row{display:grid; grid-template-columns:1fr 1fr 1fr; gap:10px; margin-top:12px}
  .stat{background:var(--card); border:1px solid var(--line); border-radius:16px; padding:12px 14px}
  .stat .v{font-weight:800; font-size:19px; letter-spacing:-.02em; margin-top:2px}
  .wk{
    background:var(--card); border:1px solid var(--line); border-radius:18px;
    padding:14px 16px; margin-top:10px; width:100%; text-align:left;
    display:block; cursor:pointer;
  }
  .wk:active{background:var(--card2)}
  .wk:focus-visible{outline:2px solid var(--accent); outline-offset:2px}
  .wk-top{display:flex; justify-content:space-between; align-items:baseline}
  .wk-label{font-weight:700; font-size:15px}
  .wk-amt{font-weight:800; font-size:16px}
  .wk-amt.over{color:var(--bad)}
  .wk-sub{font-size:12.5px; color:var(--ink2); margin-top:2px}
  .wk .meter-track{height:8px; margin-top:10px}
  .wk-detail{margin-top:12px; border-top:1px solid var(--line); padding-top:4px}
  .wk-detail .exp{padding:10px 2px}

  /* plan tab */
  .flow{background:var(--card); border:1px solid var(--line); border-radius:22px; padding:18px 18px 16px; margin-top:12px; box-shadow:var(--shadow)}
  .flow-row{display:flex; justify-content:space-between; align-items:baseline; padding:7px 0; font-size:14.5px}
  .flow-row .lbl{color:var(--ink2)}
  .flow-row .val{font-weight:700}
  .flow-row.minus .val{color:var(--ink2)}
  .flow-left{border-top:1px solid var(--line); margin-top:6px; padding-top:12px}
  .flow-left .lbl{color:var(--ink); font-weight:700}
  .flow-left .val{font-size:22px; font-weight:800; letter-spacing:-.02em}
  .flow-left .val.neg{color:var(--bad)}
  .suggest{
    display:flex; align-items:center; gap:12px; margin-top:12px;
    background:var(--card2); border-radius:14px; padding:12px 14px;
  }
  .suggest .txt{flex:1; font-size:13px; color:var(--ink2); line-height:1.4}
  .suggest .txt b{color:var(--ink)}
  .suggest button{
    flex:none; background:var(--accent); color:var(--on-accent); font-weight:700;
    font-size:13px; padding:9px 14px; border-radius:999px;
  }
  .row-item{
    display:flex; align-items:center; gap:12px; width:100%; text-align:left;
    padding:12px 14px; border-bottom:1px solid var(--line);
  }
  .row-item:last-child{border-bottom:0}
  .row-item:active{background:var(--card2)}
  .row-list{background:var(--card); border:1px solid var(--line); border-radius:18px; overflow:hidden}
  .pill{
    font-size:10.5px; font-weight:700; text-transform:uppercase; letter-spacing:.08em;
    padding:3px 9px; border-radius:999px; background:var(--card2); color:var(--ink2);
    border:1px solid var(--line); flex:none;
  }
  .pill.loan{color:var(--bad); border-color:color-mix(in srgb, var(--bad) 35%, transparent)}
  .row-item .name{flex:1; min-width:0; font-weight:600; font-size:15px}
  .row-item .name .ttl{display:block; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
  .row-item .subline{display:block; white-space:normal; font-size:12px; font-weight:500; color:var(--ink3); line-height:1.4; margin-top:1px}
  .row-item .subline.hl{color:var(--accent-deep); font-weight:700}
  .row-item .amt{font-weight:700; font-size:15px; flex:none}
  .row-item .amt small{font-weight:600; color:var(--ink3); font-size:11px}
  .addrow{
    width:100%; text-align:center; padding:13px; border-radius:16px; margin-top:10px;
    border:1.5px dashed var(--line); color:var(--accent-deep); font-weight:700; font-size:14px;
    background:transparent;
  }
  .goal{background:var(--card); border:1px solid var(--line); border-radius:18px; padding:14px 16px; margin-top:10px}
  .goal-top{display:flex; justify-content:space-between; align-items:baseline; gap:10px}
  .goal-name{font-weight:700; font-size:15px}
  .goal-amt{font-size:13px; color:var(--ink2)}
  .goal-amt b{color:var(--ink)}
  .goal .meter-track{height:9px; margin-top:10px}
  .goal-foot{display:flex; justify-content:space-between; align-items:center; margin-top:10px; gap:10px}
  .goal-pct{font-size:12.5px; font-weight:700; color:var(--accent-deep)}
  .goal-pct.done{color:var(--good)}
  .goal-actions{display:flex; gap:8px}
  .mini-btn{
    font-size:13px; font-weight:700; padding:8px 14px; border-radius:999px;
    background:var(--card2); border:1px solid var(--line); white-space:nowrap;
  }
  .goal-pct{min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
  .mini-btn.primary{background:var(--accent); border-color:transparent; color:var(--on-accent)}

  .panel{background:var(--card); border:1px solid var(--line); border-radius:18px; padding:16px; margin-top:12px}
  .panel h3{margin:0 0 4px; font-size:15px}
  .panel p{margin:0 0 12px; color:var(--ink2); font-size:13.5px}
  .field{margin-bottom:14px}
  .field:last-child{margin-bottom:0}
  .field label{display:block; margin-bottom:6px}
  .btn{
    display:inline-flex; align-items:center; justify-content:center; gap:8px;
    border-radius:14px; padding:13px 18px; font-weight:700; font-size:15px;
    background:var(--card2); border:1px solid var(--line); width:100%;
  }
  .btn:active{transform:scale(.98)}
  .btn svg{width:16px; height:16px; flex:none}
  .btn:disabled{opacity:.45}
  .btn.primary{background:var(--accent); border-color:transparent; color:var(--on-accent)}
  .btn.danger{color:var(--bad)}
  .hint{font-size:12.5px; color:var(--ink3); margin-top:8px; line-height:1.5}

  .tabbar{
    position:fixed; left:0; right:0; bottom:0; z-index:40;
    display:flex; justify-content:center;
    padding:0 16px calc(12px + env(safe-area-inset-bottom));
    pointer-events:none;
  }
  .tabbar-inner{
    pointer-events:auto; display:flex; align-items:center; gap:4px;
    background:var(--card); border:1px solid var(--line); border-radius:22px;
    padding:6px; box-shadow:var(--shadow); width:100%; max-width:448px;
  }
  .tab{
    flex:1; display:flex; flex-direction:column; align-items:center; gap:3px;
    padding:8px 4px; border-radius:16px; color:var(--ink2); font-size:11px; font-weight:700;
    letter-spacing:.04em;
  }
  .tab svg{width:22px; height:22px}
  .tab.active{color:var(--accent-deep); background:var(--card2)}
  .addbtn{
    flex:none; width:56px; height:56px; border-radius:19px; background:var(--accent);
    color:var(--on-accent); display:grid; place-items:center; margin:0 4px;
    box-shadow:0 6px 18px rgba(232,158,36,.45);
  }
  .addbtn svg{width:26px; height:26px}
  .addbtn:active{transform:scale(.94)}

  .cat-breakdown{min-width:0}
  @media (max-width:380px){
    .cat-breakdown{flex-direction:column !important; align-items:stretch !important; gap:8px !important}
    .cat-breakdown .donut-container{align-self:center}
    .cat-breakdown .cat-row{grid-template-columns:minmax(0,1fr) minmax(0,1fr) auto; gap:8px}
  }

  .backdrop{
    position:fixed; inset:0; background:rgba(12,10,24,.55); z-index:60;
    opacity:0; pointer-events:none; transition:opacity .25s ease;
  }
  .backdrop.show{opacity:1; pointer-events:auto}
  .sheet{
    position:fixed; left:0; right:0; bottom:0; z-index:70;
    max-width:480px; margin:0 auto;
    background:var(--card); border-radius:26px 26px 0 0; box-shadow:var(--sheet-shadow);
    padding:14px 20px calc(22px + env(safe-area-inset-bottom));
    transform:translateY(105%); transition:transform .3s cubic-bezier(.32,.72,.24,1);
    max-height:92dvh; overflow-y:auto;
  }
  .sheet.show{transform:translateY(0)}
  @media (prefers-reduced-motion: reduce){ .sheet{transition:none} .backdrop{transition:none} }
  .grab{width:40px; height:5px; border-radius:3px; background:var(--line); margin:0 auto 14px}
  .sheet-x{
    position:absolute; top:14px; right:16px; width:34px; height:34px; border-radius:50%;
    background:var(--card2); color:var(--ink2); display:grid; place-items:center;
    font-size:17px; font-weight:700; line-height:1; z-index:5;
  }
  .sheet-x:active{background:var(--line)}
  .sheet h2{margin:0 0 14px; font-size:19px; letter-spacing:-.01em}

  .amount-wrap{position:relative; margin-bottom:14px}
  .amount-wrap .cur{
    position:absolute; right:16px; top:50%; transform:translateY(-50%);
    font-weight:700; color:var(--ink2); font-size:17px; pointer-events:none;
  }
  #f-amount{
    font-size:34px; font-weight:800; letter-spacing:-.02em; padding:14px 76px 14px 18px;
    border-radius:16px;
  }
  .chips{display:flex; flex-wrap:wrap; gap:8px; margin-bottom:14px}
  .chip{
    display:inline-flex; align-items:center; gap:7px; padding:9px 13px;
    border-radius:999px; border:1.5px solid var(--line); background:var(--card2);
    font-size:13.5px; font-weight:600; color:var(--ink);
  }
  .chip .cat-dot{width:9px; height:9px}
  .chip.sel{border-color:var(--accent); background:color-mix(in srgb, var(--accent) 16%, var(--card))}
  .row2{display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:14px}

  .photo-btn{
    display:flex; align-items:center; gap:12px; width:100%;
    background:var(--card2); border:1.5px dashed var(--line); border-radius:16px;
    padding:12px 14px; margin-bottom:16px; text-align:left;
  }
  .photo-btn .ic{
    width:44px; height:44px; border-radius:12px; background:var(--card);
    border:1px solid var(--line); display:grid; place-items:center; color:var(--accent-deep); flex:none;
    overflow:hidden;
  }
  .photo-btn .ic img{width:100%; height:100%; object-fit:cover}
  .photo-btn .t{font-weight:700; font-size:14.5px}
  .photo-btn .s{font-size:12.5px; color:var(--ink2)}
  .spin{
    width:18px; height:18px; border-radius:50%; flex:none;
    border:2.5px solid var(--line); border-top-color:var(--accent);
    animation:spinner .8s linear infinite;
  }
  @keyframes spinner{to{transform:rotate(360deg)}}

  .detail-photo{width:100%; border-radius:16px; margin-bottom:14px; max-height:48dvh; object-fit:contain; background:var(--card2)}
  .detail-grid{display:grid; grid-template-columns:auto 1fr; gap:8px 16px; font-size:14.5px; margin-bottom:16px}
  .detail-grid dt{color:var(--ink2)}
  .detail-grid dd{margin:0; font-weight:600; text-align:right}

  .viewer{position:fixed; inset:0; z-index:90; background:rgba(8,6,18,.94); display:none; place-items:center; padding:20px}
  .viewer.show{display:grid}
  .viewer img{max-width:100%; max-height:82dvh; border-radius:12px}
  .viewer .close{position:absolute; top:calc(16px + env(safe-area-inset-top)); right:18px; color:#fff; font-size:15px; font-weight:700; background:rgba(255,255,255,.14); padding:8px 14px; border-radius:999px}

  #toast{
    position:fixed; left:50%; bottom:calc(104px + env(safe-area-inset-bottom)); transform:translateX(-50%) translateY(20px);
    background:var(--ink); color:var(--bg); padding:10px 18px; border-radius:999px;
    font-size:14px; font-weight:600; opacity:0; transition:all .3s ease; z-index:100;
    white-space:nowrap; max-width:92vw; overflow:hidden; text-overflow:ellipsis;
    pointer-events:none;
  }
  #toast.show{opacity:1; transform:translateX(-50%) translateY(0)}
  #toast.action{pointer-events:auto; display:flex; align-items:center; gap:12px}
  #toast.action button{
    background:var(--accent); color:var(--on-accent); font-weight:800; font-size:13px;
    padding:6px 14px; border-radius:999px; flex:none;
  }

  #updatebar{
    position:fixed; top:0; left:0; right:0; z-index:200;
    display:none; justify-content:center; align-items:center; gap:14px;
    padding:calc(10px + env(safe-area-inset-top)) 16px 10px;
    background:var(--accent); color:var(--on-accent);
    font-size:14px; font-weight:700;
  }
  #updatebar.show{display:flex}
  #updatebar button{
    background:var(--on-accent); color:var(--accent);
    font-weight:800; font-size:13px; padding:7px 16px; border-radius:999px;
  }

  .onb{padding-top:8vh}
  .onb .brand-mark{width:56px; height:56px; border-radius:18px; font-size:24px; margin-bottom:18px}
  .onb h1{font-size:32px; letter-spacing:-.03em; margin:0 0 8px; line-height:1.1; text-wrap:balance}
  .onb .lede{color:var(--ink2); margin:0 0 26px; font-size:16px; max-width:34ch}
</style>

<body>

<div id="updatebar"><span>A new version is ready</span><button id="updatebar-go">Update</button></div>
<main id="shell"></main>

<div class="backdrop" id="backdrop" aria-hidden="true"></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-hidden="true"></div>
<div class="viewer" id="viewer" role="dialog" aria-modal="true" aria-label="Receipt photo" aria-hidden="true"><button class="close" id="viewer-close">Close</button><img id="viewer-img" alt="Receipt photo"></div>
<div id="toast" role="status"></div>
<input type="file" accept="image/*" capture="environment" id="camera" hidden>

<script src="scan.js?v=5.5"></script>
<script>
(function(){
  "use strict";

  /* ---------- data ---------- */
  var APP_VERSION = "5.5";
  var KEY = "weekend-wallet-v1";
  var CATS = [
    {id:"food",      name:"Food",      v:"--c-food"},
    {id:"drinks",    name:"Drinks",    v:"--c-drinks"},
    {id:"out",       name:"Going out", v:"--c-out"},
    {id:"transport", name:"Transport", v:"--c-transport"},
    {id:"shop",      name:"Shopping",  v:"--c-shop"},
    {id:"other",     name:"Other",     v:"--c-other"},
    {id:"missing",   name:"Not logged", v:"--c-missing"}
  ];
  /* "Not logged" is written by the cash check, never picked by hand */
  var PICK_CATS = CATS.filter(function(c){ return c.id !== "missing"; });
  var CURRENCIES = [
    {code:"MAD", label:"Moroccan dirham (DH)"},
    {code:"USD", label:"US dollar ($)"},
    {code:"EUR", label:"Euro (€)"},
    {code:"GBP", label:"British pound (£)"},
    {code:"AED", label:"UAE dirham"},
    {code:"SAR", label:"Saudi riyal"},
    {code:"CAD", label:"Canadian dollar"},
    {code:"TRY", label:"Turkish lira"},
    {code:"INR", label:"Indian rupee (₹)"},
    {code:"AUD", label:"Australian dollar (A$)"},
    {code:"JPY", label:"Japanese yen (¥)"},
    {code:"CHF", label:"Swiss franc (CHF)"},
    {code:"CNY", label:"Chinese yuan (¥)"},
    {code:"BRL", label:"Brazilian real (R$)"},
    {code:"MXN", label:"Mexican peso ($)"},
    {code:"ZAR", label:"South African rand (R)"},
    {code:"KWD", label:"Kuwaiti dinar (KD)"},
    {code:"QAR", label:"Qatari riyal (QR)"},
    {code:"EGP", label:"Egyptian pound (EGP)"},
    {code:"RUB", label:"Russian ruble (₽)"}
  ];
  var SCAN_MODELS = [
    {id:"claude-opus-4-8",  label:"Best accuracy — Claude Opus 4.8"},
    {id:"claude-haiku-4-5", label:"Cheaper & faster — Claude Haiku 4.5"}
  ];

  var state = load();
  state.expenses = cleanExpenses(state.expenses);
  cleanRows();
  function load(){
    try{
      var raw = localStorage.getItem(KEY);
      if(raw){
        var s = JSON.parse(raw);
        if(typeof s.apiKey !== "string") s.apiKey = "";
        if(typeof s.geminiApiKey !== "string") s.geminiApiKey = "";
        if(typeof s.scanProvider !== "string") s.scanProvider = s.apiKey ? "claude" : (s.geminiApiKey ? "gemini" : "free");
        if(typeof s.salary !== "number") s.salary = 0;
        if(!Array.isArray(s.commitments)) s.commitments = [];
        s.commitments.forEach(function(c){ if(!c.paid || typeof c.paid !== "object") c.paid = {}; });
        if(!Array.isArray(s.goals)) s.goals = [];
        if(!s.swept || typeof s.swept !== "object") s.swept = {};
        if(typeof s.payday !== "number") s.payday = 0;
        if(!Array.isArray(s.debts)) s.debts = [];
        if(typeof s.backupTs !== "number") s.backupTs = 0;
        if(typeof s.nudgedAt !== "number") s.nudgedAt = 0;
        if(typeof s.lastCat !== "string") s.lastCat = "";
        if(typeof s.restAmount !== "number") s.restAmount = 0;
        if(typeof s.restFrom !== "string") s.restFrom = "";
        s.expenses = cleanExpenses(s.expenses);
        /* carry over an old borrow limit into the new "money for rest of month" */
        if(s.restAmount === 0 && typeof s.borrowCap === "number" && s.borrowCap > 0){
          s.restAmount = s.borrowCap; s.restFrom = todayIso(); s.restTs = Date.now();
        }
        /* "money for the rest of the month" belongs to the month you set it in.
           Once the month turns it's meaningless — last month's spending would
           eat a budget spread over the new month's days. Retire it and ask
           for a fresh number. */
        retireStalePool(s);
        if(typeof s.restAsk !== "string") s.restAsk = "";
        if(typeof s.restTs !== "number") s.restTs = 0;
        if(typeof s.cashTs !== "number") s.cashTs = 0;
        if(!s.wkPlan || typeof s.wkPlan !== "object") s.wkPlan = {};
        if(typeof s.wkWeight !== "number" || !(s.wkWeight > 0)) s.wkWeight = 2;
        return s;
      }
    }catch(e){}
    return { setup:false, budget:0, currency:"USD", expenses:[], apiKey:"", geminiApiKey:"", scanProvider:"free", scanModel:"claude-opus-4-8",
             salary:0, commitments:[], goals:[], swept:{}, payday:0, debts:[], restAmount:0, restFrom:"", restTs:0, cashTs:0, wkPlan:{}, wkWeight:2 };
  }
  /* A backup is just a file — it can be edited, truncated or half-written.
     One row without a date used to be saved and then throw on the next render,
     leaving a white screen that survived every reload. Coerce what we can and
     drop what we can't. */
  var ISO_RE = /^\d{4}-\d{2}-\d{2}$/;
  function cleanExpenses(list){
    if(!Array.isArray(list)) return [];
    return list.filter(function(e){
      return e && typeof e === "object" && ISO_RE.test(e.date) && isFinite(+e.amount);
    }).map(function(e){
      var validCat = CATS.some(function(c){ return c.id === e.cat; });
      return { id: e.id || uid(), ts: +e.ts || 0, amount: Math.round((+e.amount)*100)/100,
               cat: validCat ? e.cat : "other",
               note: typeof e.note === "string" ? e.note : "",
               date: e.date, photo: safePhoto(e.photo) || null,
               loanId: typeof e.loanId === "string" ? e.loanId : "",
               loanAdded: +e.loanAdded > 0 ? Math.round((+e.loanAdded)*100)/100 : 0 };
    });
  }
  /* the rest of the shapes, coerced in place */
  function cleanRows(){
    state.commitments = (state.commitments||[]).filter(function(c){ return c && typeof c === "object"; })
      .map(function(c){
      return { id: c.id || uid(), name: String(c.name || "Bill"),
                 amount: +c.amount || 0, kind: c.kind === "loan" ? "loan" : "sub",
                 due: (+c.due >= 1 && +c.due <= 31) ? +c.due : 0,
                 remaining: +c.remaining || 0,
                 coverShortfall: c.kind === "loan" && (c.coverShortfall === true ||
                   (c.coverShortfall == null && String(c.name || "").trim().toLowerCase() === "dad")),
                 paid: (c.paid && typeof c.paid === "object") ? c.paid : {} };
      });
    state.goals = (state.goals||[]).filter(function(g){ return g && typeof g === "object"; })
      .map(function(g){
        return { id: g.id || uid(), name: String(g.name || "Goal"), target: +g.target || 0,
                 saved: +g.saved || 0, monthly: +g.monthly || 0 };
      });
    state.debts = (state.debts||[]).filter(function(d){ return d && typeof d === "object"; })
      .map(function(d){
        var log = Array.isArray(d.log) ? d.log.filter(function(l){
          return l && isFinite(+l.amt) && (l.dir === "b" || l.dir === "r");
        }).map(function(l){
          return { ts: +l.ts || 0, amt: +l.amt, dir: l.dir, note: String(l.note || ""),
                   bumped: +l.bumped || 0 };
        }) : [];
        return { id: d.id || uid(), name: String(d.name || "Someone"),
                 balance: +d.balance || 0, log: log };
      });
  }
  /* "money for the rest of the month" belongs to the month you set it in */
  function retireStalePool(s){
    if(s.restFrom && s.restFrom.slice(0,7) !== todayIso().slice(0,7)){
      s.restAmount = 0; s.restFrom = ""; s.restTs = 0; s.restAsk = todayIso().slice(0,7);
    }
  }

  function save(opts){
    try{
      localStorage.setItem(KEY, JSON.stringify(state));
      return true;
    }catch(e){
      if(opts && opts.retryWithoutPhoto && opts.retryWithoutPhoto.photo){
        opts.retryWithoutPhoto.photo = null;
        try{
          localStorage.setItem(KEY, JSON.stringify(state));
          toast("Storage full — saved without the photo");
          return true;
        }catch(e2){}
      }
      toast("Storage full — delete old weekends in History");
      return false;
    }
  }

  /* ---------- helpers ---------- */
  function $(s, el){ return (el||document).querySelector(s); }
  function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g, function(c){
    return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];
  });}
  function safePhoto(s){
    s = typeof s === "string" ? s : "";
    return /^data:image\/(?:gif|jpe?g|png|webp|bmp|svg\+xml);/i.test(s) ? s : "";
  }
  function cat(id){ for(var i=0;i<CATS.length;i++){ if(CATS[i].id===id) return CATS[i]; } return CATS[CATS.length-1]; }
  function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,7); }

  /* accepts 7,5 and 7.5 and "7 500,25" — people type money both ways */
  function num(v){
    if(typeof v === "number") return v;
    var s = String(v == null ? "" : v).trim().replace(/\s/g, "");
    if(!s) return NaN;
    var lastDot = s.lastIndexOf("."), lastCom = s.lastIndexOf(",");
    if(lastDot > -1 && lastCom > -1){
      if(lastCom > lastDot){ s = s.replace(/\./g, ""); s = s.slice(0,lastCom).replace(/,/g,"") + "." + s.slice(lastCom+1); }
      else { s = s.replace(/,/g, ""); }
    }else if(lastCom > -1){
      var dec = s.length - lastCom - 1;
      s = (dec >= 1 && dec <= 2) ? s.slice(0,lastCom) + "." + s.slice(lastCom+1) : s.replace(/,/g, "");
    }
    return parseFloat(s);
  }

  function fmt(n){
    try{
      var o = new Intl.NumberFormat(undefined, {style:"currency", currency:state.currency, maximumFractionDigits:2});
      var s = o.format(n);
      return s.replace(/[.,]00(\s|$)/, "$1").trim();
    }catch(e){ return n + " " + state.currency; }
  }

  function iso(d){
    return d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0") + "-" + String(d.getDate()).padStart(2,"0");
  }
  function fromIso(s){ var p = s.split("-"); return new Date(+p[0], +p[1]-1, +p[2]); }

  /* the Friday that anchors the weekend a given date belongs to.
     Fri/Sat/Sun -> that weekend; Mon–Thu -> the weekend just finished */
  function weekendOf(dateStr){
    var d = fromIso(dateStr), day = d.getDay();
    var back = (day===5)?0 : (day===6)?1 : (day===0)?2 : day+2;
    d.setDate(d.getDate()-back);
    return iso(d);
  }
  function weekendLabel(friIso, withYear){
    var f = fromIso(friIso), s = new Date(f); s.setDate(s.getDate()+2);
    var mo = function(d){ return d.toLocaleDateString(undefined,{month:"short"}); };
    var lbl = (f.getMonth()===s.getMonth())
      ? mo(f)+" "+f.getDate()+"–"+s.getDate()
      : mo(f)+" "+f.getDate()+" – "+mo(s)+" "+s.getDate();
    if(withYear) lbl += ", " + s.getFullYear();
    return lbl;
  }
  function todayIso(){ return iso(new Date()); }
  function currentWeekend(){ return weekendOf(todayIso()); }
  function isLiveWeekend(friIso){
    var t = fromIso(todayIso()), f = fromIso(friIso), s = new Date(f); s.setDate(s.getDate()+2);
    return t >= f && t <= s;
  }
  function daysUntilFriday(){
    var day = new Date().getDay();
    return (5 - day + 7) % 7;
  }
  /* only Fri/Sat/Sun expenses belong to a weekend; weekday spending is monthly */
  function weekendKeyOf(dateStr){
    var day = fromIso(dateStr).getDay();
    return (day===5 || day===6 || day===0) ? weekendOf(dateStr) : null;
  }
  function expensesFor(friIso){
    return state.expenses.filter(function(e){ return weekendKeyOf(e.date)===friIso; })
      .sort(function(a,b){ return a.date < b.date ? -1 : a.date > b.date ? 1 : (a.ts||0)-(b.ts||0); });
  }
  function total(list){ return list.reduce(function(s,e){ return s + e.amount; }, 0); }
  function monthSpent(mk){
    mk = mk || todayIso().slice(0,7);
    return total(state.expenses.filter(function(e){ return e.date.slice(0,7)===mk; }));
  }
  function spentOn(dIso){
    return total(state.expenses.filter(function(e){ return e.date===dIso; }));
  }
  function upcomingBills(){
    var out = [], now = new Date(), today = now.getDate();
    var dim = new Date(now.getFullYear(), now.getMonth()+1, 0).getDate();
    state.commitments.forEach(function(c){
      if(!c.due) return;
      if(paidRec(c)) return;                  // already handled this month
      var days = c.due - today;
      if(days < 0) days += dim;
      if(days <= 10) out.push({c:c, days:days});
    });
    out.sort(function(a,b){ return a.days-b.days; });
    return out;
  }
  /* net ledger per person: balance > 0 = I owe them, < 0 = they owe me */
  function iOweTotal(){
    return state.debts.reduce(function(s,d){ return s + Math.max(d.balance, 0); }, 0);
  }
  function owedToMeTotal(){
    return state.debts.reduce(function(s,d){ return s + Math.max(-d.balance, 0); }, 0);
  }
  function debtTotal(){ return iOweTotal(); }
  function findOrCreatePerson(name){
    var d = null;
    state.debts.forEach(function(x){ if(x.name.toLowerCase()===name.toLowerCase()) d = x; });
    if(!d){ d = { id: uid(), name: name, balance: 0, log: [] }; state.debts.push(d); }
    return d;
  }
  /* dir 'b' = they gave me money (my debt grows), 'r' = I gave them money */
  function ledgerAdd(d, dir, amt, note){
    d.balance = Math.round((d.balance + (dir==="b" ? amt : -amt))*100)/100;
    d.log.push({ ts: Date.now(), amt: amt, dir: dir, note: note || "" });
  }
  function balanceLabel(d){
    if(d.balance > 0) return 'you owe <b class="money" style="color:var(--bad)">'+fmt(d.balance)+'</b>';
    if(d.balance < 0) return 'owes you <b class="money" style="color:var(--good)">'+fmt(-d.balance)+'</b>';
    return '<b style="color:var(--good)">all settled</b>';
  }
  function borrowedThisMonth(){
    var start = new Date(); start.setDate(1); start.setHours(0,0,0,0);
    var t = start.getTime(), sum = 0;
    state.debts.forEach(function(d){
      (d.log||[]).forEach(function(l){ if(l.dir==="b" && l.ts >= t) sum += l.amt; });
    });
    return sum;
  }
  /* only offer to sweep money you really still have — the old version could
     "save" the unspent part of a fixed weekend budget while the actual pool
     was already in the red */
  function sweepInfo(){
    var fri = currentWeekend();
    if(isLiveWeekend(fri) || state.swept[fri] || !state.goals.length) return null;
    var plan = (state.wkPlan||{})[fri];
    if(!(plan > 0)) return null;
    var left = Math.round((plan - total(expensesFor(fri)))*100)/100;
    var real = poolLeftForRates();
    if(real !== null) left = Math.min(left, Math.floor(real));
    return left > 0 ? { fri: fri, amount: left } : null;
  }

  /* ---------- toast ---------- */
  var toastTimer;
  function toast(msg){
    var t = $("#toast"); t.textContent = msg; t.classList.remove("action"); t.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function(){ t.classList.remove("show"); }, 2800);
  }
  function toastAction(msg, label, fn, ms){
    var t = $("#toast");
    t.innerHTML = "";
    t.appendChild(document.createTextNode(msg));
    var b = document.createElement("button");
    b.textContent = label;
    b.addEventListener("click", function(){
      t.classList.remove("show","action");
      clearTimeout(toastTimer);
      fn();
    });
    t.appendChild(b);
    t.classList.add("show","action");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function(){ t.classList.remove("show","action"); }, ms || 6000);
  }

  /* ---------- icons ---------- */
  var IC = {
    home:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 10.5 12 4l8 6.5V19a1.5 1.5 0 0 1-1.5 1.5h-13A1.5 1.5 0 0 1 4 19v-8.5Z"/><path d="M9.5 20.5v-6h5v6"/></svg>',
    wallet:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="6" width="18" height="13" rx="3"/><path d="M3 10h18M16 15h.01"/></svg>',
    history:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12a8 8 0 1 0 2.3-5.6L4 8.5"/><path d="M4 4v4.5H8.5"/><path d="M12 8v4l3 2"/></svg>',
    gear:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3.2"/><path d="M19 12a7 7 0 0 0-.14-1.4l2-1.55-2-3.46-2.35.95A7 7 0 0 0 14.1 5.1L13.7 2.6h-3.4l-.4 2.5a7 7 0 0 0-2.4 1.44l-2.36-.95-2 3.46 2 1.55A7 7 0 0 0 5 12c0 .48.05.94.14 1.4l-2 1.55 2 3.46 2.35-.95c.7.63 1.52 1.12 2.41 1.44l.4 2.5h3.4l.4-2.5a7 7 0 0 0 2.4-1.44l2.36.95 2-3.46-2-1.55c.09-.46.14-.92.14-1.4Z"/></svg>',
    plus:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>',
    camera:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8h2.5l1.5-2.5h8L17.5 8H20a1.5 1.5 0 0 1 1.5 1.5V18A1.5 1.5 0 0 1 20 19.5H4A1.5 1.5 0 0 1 2.5 18V9.5A1.5 1.5 0 0 1 4 8Z"/><circle cx="12" cy="13.5" r="3.4"/></svg>',
    plan:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3a9 9 0 1 0 9 9h-9V3Z"/><path d="M15.5 3.7A9 9 0 0 1 20.3 8.5H15.5V3.7Z"/></svg>',
    banknote:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="2.5" y="6" width="19" height="12" rx="2.5"/><circle cx="12" cy="12" r="2.6"/><path d="M6 9.5h.01M18 14.5h.01"/></svg>',
    bank:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3.5 9 12 4l8.5 5v1.5h-17V9Z"/><path d="M5.5 10.5V17M9.8 10.5V17M14.2 10.5V17M18.5 10.5V17M3.5 19.5h17"/></svg>',
    repeat:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M17 2.5 20.5 6 17 9.5"/><path d="M3.5 11V9.5A3.5 3.5 0 0 1 7 6h13.5M7 21.5 3.5 18 7 14.5"/><path d="M20.5 13v1.5A3.5 3.5 0 0 1 17 18H3.5"/></svg>',
    target:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="8.5"/><circle cx="12" cy="12" r="4.8"/><circle cx="12" cy="12" r="1.2"/></svg>',

    check:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="m8 12.5 2.7 2.7L16 9.5"/></svg>',
    chev:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m9.5 5.5 6.5 6.5-6.5 6.5"/></svg>'
  };
  var CAT_IC = {
    food:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M7 3v7a2 2 0 0 0 2 2v9M11 3v7a2 2 0 0 1-2 2M7 3v4M17 3c-1.7 0-3 2-3 5v4h3v9M17 3v18"/></svg>',
    drinks:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 3.5h14l-6 8v7M12 18.5H8.5m3.5 0h3.5M7 6.5h10"/></svg>',
    out:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3.5 9V6.5A1.5 1.5 0 0 1 5 5h14a1.5 1.5 0 0 1 1.5 1.5V9a3 3 0 0 0 0 6v2.5A1.5 1.5 0 0 1 19 19H5a1.5 1.5 0 0 1-1.5-1.5V15a3 3 0 0 0 0-6Z"/><path d="M14 5v2.5M14 11v2M14 16.5V19"/></svg>',
    transport:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 15.5 6.5 9a2 2 0 0 1 2-1.5h7A2 2 0 0 1 17.5 9L19 15.5M5 15.5h14M5 15.5V19a1 1 0 0 0 1 1h1a1 1 0 0 0 1-1v-1h8v1a1 1 0 0 0 1 1h1a1 1 0 0 0 1-1v-3.5"/><path d="M7.5 12.5h.01M16.5 12.5h.01"/></svg>',
    shop:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 8h12l1 12.5H5L6 8Z"/><path d="M9 10.5V6a3 3 0 0 1 6 0v4.5"/></svg>',
    other:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m12 3 9 5.6L12 14 3 8.6 12 3Z" opacity="0"/><path d="M3.5 12.5 11.5 4.5a1.7 1.7 0 0 1 1.2-.5h6.3a1.5 1.5 0 0 1 1.5 1.5v6.3c0 .45-.18.88-.5 1.2l-8 8a1.5 1.5 0 0 1-2.12 0l-6.38-6.38a1.5 1.5 0 0 1 0-2.12Z"/><circle cx="16" cy="8" r="1.1"/></svg>',
    missing:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3.5h12v17l-2-1.4-2 1.4-2-1.4-2 1.4-2-1.4-2 1.4v-17Z"/><path d="M10 9.2a2 2 0 1 1 2.6 1.9c-.4.15-.6.5-.6.95v.6"/><path d="M12 15.6h.01"/></svg>'
  };
  function catIcon(id){ return CAT_IC[id] || CAT_IC.other; }
  function catTile(c, size){
    return '<span class="'+(size==="big"?"exp-thumb":"ic-tile")+'" style="color:var('+c.v+'); background:color-mix(in srgb, var('+c.v+') 15%, var(--card2))">'+catIcon(c.id)+'</span>';
  }
  function kindTile(kind){
    var v = kind==="loan" ? "--bad" : "--c-drinks";
    return '<span class="ic-tile" style="color:var('+v+'); background:color-mix(in srgb, var('+v+') 14%, var(--card2))">'+(kind==="loan"? IC.bank : IC.repeat)+'</span>';
  }
  function emptyBox(icon, html){
    return '<div class="empty">'+icon+html+'</div>';
  }

  /* ---------- views ---------- */
  var tab = "home";
  var shell = $("#shell");

  function render(){
    if(!state.setup){ renderOnboarding(); return; }
    var html = topbar();
    if(tab==="home") html += viewHome();
    else if(tab==="plan") html += viewPlan();
    else if(tab==="history") html += viewHistory();
    else html += viewSettings();
    html += tabbar();
    shell.innerHTML = html;
    bindView();
    syncToggleSemantics(shell);
  }

  function topbar(){
    return '<header class="topbar"><div class="brand">' +
      '<div class="brand-mark" aria-hidden="true">W</div>' +
      '<div><div class="brand-name">Weekend Wallet</div>' +
      '<div class="brand-sub">Daily money · weekend fun</div></div></div></header>';
  }

  function tabbar(){
    function t(id, label, icon){
      return '<button class="tab'+(tab===id?" active":"")+'" data-tab="'+id+'" aria-label="'+label+'">'+icon+'<span>'+label+'</span></button>';
    }
    return '<nav class="tabbar"><div class="tabbar-inner">' +
      t("home","Home",IC.home) +
      t("plan","Plan",IC.plan) +
      '<button class="addbtn" id="open-add" aria-label="Add expense">'+IC.plus+'</button>' +
      t("history","History",IC.history) +
      t("settings","Settings",IC.gear) +
      '</div></nav>';
  }

  function meterHtml(spent, budget){
    var pct = budget>0 ? Math.min(spent/budget*100, 100) : 0;
    var cls = spent>budget ? " over" : (budget>0 && spent/budget>.85 ? " warn" : "");
    return '<div class="meter-track"><div class="meter-fill'+cls+'" style="width:'+pct.toFixed(1)+'%"></div></div>';
  }

  function paydayChip(){
    if(!state.payday) return "";
    var now = new Date(), today = now.getDate();
    var dim = new Date(now.getFullYear(), now.getMonth()+1, 0).getDate();
    var days = state.payday - today;
    if(days < 0) days += dim;
    var txt = days===0 ? "payday today!" : days===1 ? "payday tomorrow" : "payday in "+days+" days";
    return '<span style="color:var(--accent-deep); font-weight:700">'+txt+'</span>';
  }

  /* 7-day mini sparkline — shows daily spending as bars over last 7 days */
  function dailySparklineHtml(){
    var days = 7;
    var bars = [];
    for(var i = days - 1; i >= 0; i--){
      var d = new Date(); d.setDate(d.getDate() - i);
      var diso = iso(d);
      bars.push({ diso: diso, amt: spentOn(diso), isToday: i === 0 });
    }
    var maxAmt = Math.max.apply(null, bars.map(function(b){ return b.amt; })) || 1;
    var totalWeek = bars.reduce(function(s, b){ return s + b.amt; }, 0);
    if(totalWeek === 0) return "";

    var n = bars.length, viewW = 200, padL = 8, padR = 8, innerW = viewW - padL - padR;
    var slot = innerW / n, barW = Math.max(slot * 0.55, 4);

    var h = '<div style="background:var(--card); border:1px solid var(--line); border-radius:16px; padding:12px 14px 8px; margin:0 0 12px;">' +
            '<div style="display:flex; justify-content:space-between; align-items:baseline; margin-bottom:8px;">' +
            '<span style="font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:.05em; color:var(--ink2);">Last 7 days</span>' +
            '<span class="money" style="font-size:12px; font-weight:800; color:var(--ink);">'+fmt(totalWeek)+'</span>' +
            '</div>';
    h += '<svg viewBox="0 0 200 44" style="width:100%; height:44px; display:block; overflow:visible;">';

    bars.forEach(function(b, idx){
      var pct = b.amt / maxAmt;
      var barH = Math.max(pct * 32, b.amt > 0 ? 3 : 0);
      var cx = padL + slot * idx + slot / 2;
      var x = cx - barW / 2;
      var y = 34 - barH;
      var color = b.isToday ? "var(--accent)" : "var(--ink3)";
      var opacity = b.isToday ? "1" : (b.amt > 0 ? "0.6" : "0.2");

      if(b.amt > 0 || b.isToday){
        h += '<rect x="'+x.toFixed(1)+'" y="'+y.toFixed(1)+'" width="'+barW.toFixed(1)+'" height="'+Math.max(barH,2).toFixed(1)+'" rx="2.5" fill="'+color+'" opacity="'+opacity+'"/>';
      }

      /* day label */
      var dayLbl = b.isToday ? "Today" : new Date(b.diso.replace(/-/g,'/')).toLocaleDateString(undefined,{weekday:"short"}).slice(0,3);
      h += '<text x="'+cx.toFixed(1)+'" y="43" text-anchor="middle" font-size="6.5" fill="'+(b.isToday?"var(--accent)":"var(--ink3)")+'" font-weight="'+(b.isToday?"800":"600")+'">'+dayLbl+'</text>';
    });

    h += '</svg></div>';
    return h;
  }

  function viewHome(){
    var monthName = new Date().toLocaleDateString(undefined,{month:"long"});
    var pm = planMath();
    var mSpent = monthSpent();
    var tSpent = spentOn(todayIso());
    var h = "";

    h += setupChecklist();

    /* month hero */
    if(state.salary > 0){
      var spendable = pm.left;
      var mFlow = ledgerFlowSince(monthStartIso());
      var mLeft = spendable - mSpent - mFlow.net;
      var flowNote = "";
      if(mFlow.out > 0 || mFlow.inn > 0){
        var parts = [];
        if(mFlow.out > 0) parts.push(fmt(mFlow.out)+" given out");
        if(mFlow.inn > 0) parts.push(fmt(mFlow.inn)+" received");
        flowNote = ' · '+parts.join(", ")+' with people';
      }
      h += '<section class="hero">' +
        '<div class="hero-top"><span class="hero-when">'+monthName+'</span>' +
        '<span class="hero-live" style="color:var(--ink2)">Today: <b class="money" style="color:var(--ink)">'+fmt(tSpent)+'</b></span></div>' +
        '<div class="hero-amount money'+(mLeft<0?" over":"")+'">'+fmt(Math.abs(mLeft))+'</div>' +
        '<div class="hero-caption">'+(mLeft<0? "over this month" : "left this month") +
        ' · spent <strong class="money">'+fmt(mSpent)+'</strong> of <strong class="money">'+fmt(Math.max(spendable,0))+'</strong>'+flowNote+'</div>' +
        '<div class="meter">'+meterHtml(mSpent + Math.max(mFlow.net,0), Math.max(spendable,0))+
        '<div class="meter-row"><span>after your loan, subscriptions & savings' +
        (pm.extra ? (pm.extra > 0 ? ' · '+fmt(pm.extra)+' more than usual' : ' · '+fmt(-pm.extra)+' less than usual') : "") +
        '</span>'+paydayChip()+'</div></div>' +
        '</section>';
      var uncovered = Math.abs(Math.min(mLeft, 0)) - borrowedThisMonth();
      if(mLeft < 0 && uncovered >= 1){
        h += '<div class="suggest"><span class="txt">You\'re <b class="money">'+fmt(Math.abs(mLeft))+'</b> over' +
          (borrowedThisMonth() > 0 ? ' — <b class="money">'+fmt(uncovered)+'</b> of it not logged yet.' : '. If your dad or a friend covered you, keep track of it.') +
          '</span><button id="h-borrow" data-amt="'+Math.round(uncovered)+'">Log it</button></div>';
      }else if(iOweTotal() > 0 || owedToMeTotal() > 0){
        var bits = [];
        if(iOweTotal() > 0) bits.push('you owe <b class="money">'+fmt(iOweTotal())+'</b> ('+
          state.debts.filter(function(d){return d.balance>0;}).map(function(d){return esc(d.name);}).join(", ")+')');
        if(owedToMeTotal() > 0) bits.push('friends owe you <b class="money">'+fmt(owedToMeTotal())+'</b> ('+
          state.debts.filter(function(d){return d.balance<0;}).map(function(d){return esc(d.name);}).join(", ")+')');
        h += '<div class="suggest"><span class="txt">'+bits.join(" · ").replace(/^y/,"Y")+'.</span>' +
          '<button id="h-owe">Manage</button></div>';
      }
    }else{
      /* no salary set: show what actually left your pocket — spending plus
         money you handed to people, minus what came back */
      var nFlow = ledgerFlowSince(monthStartIso());
      var gone = Math.round((mSpent + nFlow.net)*100)/100;
      var nNote = "";
      if(nFlow.out > 0 || nFlow.inn > 0){
        var nb = [];
        if(nFlow.out > 0) nb.push('<strong class="money">'+fmt(nFlow.out)+'</strong> given out');
        if(nFlow.inn > 0) nb.push('<strong class="money">'+fmt(nFlow.inn)+'</strong> paid back to you');
        nNote = ' · includes '+nb.join(" · ");
      }
      h += '<section class="hero">' +
        '<div class="hero-top"><span class="hero-when">'+monthName+'</span>' +
        '<span class="hero-live" style="color:var(--ink2)">Today: <b class="money" style="color:var(--ink)">'+fmt(tSpent)+'</b></span></div>' +
        '<div class="hero-amount money">'+(gone<0? "+"+fmt(-gone) : fmt(gone))+'</div>' +
        '<div class="hero-caption">'+(gone<0? "came in this month" : "out of your pocket this month")+nNote+
        ' · add your salary in <strong>Plan</strong> to see what\'s left</div>' +
        '</section>';
    }

    /* new month, and last month you were running on a set-aside pool —
       last month's number is gone, so ask for this month's */
    if(state.restAsk === monthKey() && !(state.restAmount > 0)){
      h += '<div class="suggest"><span class="txt">New month. How much do you have from today to the end of ' +
        monthName + ' — borrowing included?</span><button data-task="plan" id="h-newmonth">Set it</button></div>';
    }

    /* today card — everyday budget */
    var tb = todayBudget();
    if(tb > 0){
      var dLeft = tb - tSpent;
      h += '<div class="sec"><span class="micro">Today</span>' +
        '<span class="micro">'+daysLeftInMonth()+' days left this month</span></div>';
      var poolLine = "";
      var rr = restRemaining();
      if(rr !== null){
        poolLine = rr < 0
          ? '<div class="goal-foot"><span class="goal-pct" style="color:var(--bad); font-weight:700">'+fmt(-rr)+' past your '+fmt(state.restAmount)+' for the month</span></div>'
          : '<div class="goal-foot"><span class="goal-pct" style="color:var(--ink2)">'+fmt(rr)+' left of your '+fmt(state.restAmount)+' for the rest of the month</span></div>';
        var pf = poolFlow();
        if(pf.out > 0 || pf.inn > 0){
          var bits2 = [];
          if(pf.out > 0) bits2.push('−'+fmt(pf.out)+' given out');
          if(pf.inn > 0) bits2.push('+'+fmt(pf.inn)+' paid back to you');
          poolLine += '<div class="goal-foot"><span class="goal-pct" style="color:var(--ink3)">includes '+bits2.join(" · ")+'</span></div>';
        }
        if(pf.borrowed > 0){
          poolLine += '<div class="goal-foot"><span class="goal-pct" style="color:var(--ink3)">'+fmt(pf.borrowed)+' borrowed — already part of this budget</span></div>';
        }
      }
      h += '<div class="goal"><div class="goal-top"><span class="goal-name">'+
        new Date().toLocaleDateString(undefined,{weekday:"long"})+'</span>' +
        '<span class="goal-amt money">'+(dLeft<0
          ? '<b style="color:var(--bad)">'+fmt(Math.abs(dLeft))+'</b> over'
          : '<b>'+fmt(dLeft)+'</b> left today')+'</span></div>' +
        meterHtml(tSpent, tb) +
        '<div class="goal-foot"><span class="goal-pct" style="color:var(--ink2)">spent '+fmt(tSpent)+' of '+fmt(tb)+
        ' · rebalances daily</span></div>' + poolLine + '</div>';
    }

    /* weekend card — the same pool, seen over Fri-Sun instead of one day */
    var fri = currentWeekend();
    var live = isLiveWeekend(fri);
    var wkSpent = total(expensesFor(fri));
    var rs = rateSplit();
    h += '<div class="sec"><span class="micro">'+(live? "This weekend" : "Last weekend")+'</span>' +
      (live? '<span class="hero-live"><span class="dot"></span>Live</span>'
           : '<span class="micro">next in '+(daysUntilFriday()||7)+' day'+((daysUntilFriday()||7)>1?"s":"")+'</span>')+'</div>';
    if(live){
      var wkPlan = weekendPlan(fri, true);
      if(wkPlan > 0){
        var wkLeft = Math.round((wkPlan - wkSpent)*100)/100;
        h += '<div class="goal"><div class="goal-top"><span class="goal-name">'+weekendLabel(fri)+'</span>' +
          '<span class="goal-amt money">'+(wkLeft<0
            ? '<b style="color:var(--bad)">'+fmt(Math.abs(wkLeft))+'</b> over'
            : '<b>'+fmt(wkLeft)+'</b> left')+'</span></div>' +
          meterHtml(wkSpent, wkPlan) +
          '<div class="goal-foot"><span class="goal-pct" style="color:var(--ink2)">spent '+fmt(wkSpent)+
          ' of '+fmt(wkPlan)+' · set from the money you had on Friday</span></div></div>';
      }else{
        h += '<div class="empty">Set your salary or your money for the rest of the month in <b>Plan</b> — your weekend number comes out of it.</div>';
      }
    }else if(rs){
      /* before the weekend: a forecast, not a target */
      var soon = Math.round(rs.weekend * 3);
      h += '<div class="goal"><div class="goal-top"><span class="goal-name">'+weekendLabel(fri)+'</span>' +
        '<span class="goal-amt money"><b>'+fmt(wkSpent)+'</b> spent</span></div>' +
        '<div class="goal-foot"><span class="goal-pct" style="color:var(--ink2)">' +
        'At today\'s rate the coming weekend has about <b class="money">'+fmt(soon)+
        '</b> — spend less this week and it grows.</span></div></div>';
    }else{
      h += '<div class="empty">Set your salary or your money for the rest of the month in <b>Plan</b> — your weekend number comes out of it.</div>';
    }
    var sw = sweepInfo();
    if(sw){
      h += '<div class="suggest"><span class="txt">You didn\'t spend <b class="money">'+fmt(sw.amount)+'</b> last weekend. Put it toward a goal?</span>' +
        '<button id="h-sweep">Save it</button></div>';
    }

    /* upcoming bills */
    var up = upcomingBills();
    if(up.length){
      h += '<div class="sec"><span class="micro">Coming up</span></div><div class="row-list">';
      up.forEach(function(u){
        var soon = u.days <= 1;
        h += '<button class="row-item" data-cm="'+esc(u.c.id)+'">' + kindTile(u.c.kind) +
          '<span class="name"><span class="ttl">'+esc(u.c.name)+'</span>' +
          '<span class="subline" style="'+(soon?"color:var(--bad); font-weight:700":"")+'">' +
          (u.days===0? "due today" : u.days===1? "due tomorrow" : "due in "+u.days+" days")+'</span></span>' +
          '<span class="amt money">'+fmt(u.c.amount)+'</span></button>';
      });
      h += '</div>';
    }

    /* 7-day sparkline */
    h += dailySparklineHtml();

    /* not-logged badge — alert if there's any untracked spending */
    var missing = missingThisMonth();
    if(missing > 0){
      h += '<div style="display:flex; align-items:center; gap:10px; background:color-mix(in srgb, var(--bad) 10%, var(--card)); border:1px solid color-mix(in srgb, var(--bad) 25%, var(--line)); border-radius:14px; padding:10px 14px; margin:0 0 12px;">' +
           '<span style="color:var(--bad); flex:none; display:flex;">'+catIcon("missing")+'</span>' +
           '<span style="font-size:13px; color:var(--ink); flex:1;">' +
           '<b class="money" style="color:var(--bad);">'+fmt(missing)+'</b> logged as <b>Not logged</b> this month — from your cash checks.</span>' +
           '</div>';
    }

    /* month category breakdown */
    h += catBreakdown(state.expenses.filter(function(e){ return e.date.slice(0,7)===todayIso().slice(0,7); }),
                      "Where it went — "+monthName);

    /* recent days — the newest few. Every day lives in History > Days. */
    var groups = dayGroups(5);
    h += '<div class="sec"><span class="micro">Recent</span>' +
      (dayCount() > groups.length ? '<button class="linkish" data-task="history">See all '+dayCount()+' days</button>' : "")+'</div>';
    if(!groups.length){
      h += emptyBox(IC.receipt, 'Nothing logged yet.<br><b>Tap +</b> and snap the receipt — the amount fills in by itself.');
    }else{
      groups.forEach(function(g){
        h += '<div class="daygroup"><div class="dayhead"><span class="micro">'+dayName(g.date)+'</span>' +
          '<span class="total money">'+dayTotalText(g.out)+'</span></div><div class="exp-list">' +
          g.items.map(dayRow).join("") + '</div></div>';
      });
    }
    return h;
  }

  /* Expenses and person-money, merged and grouped by day, newest first.
     limit 0 = every day there is. */
  function dayGroups(limit){
    var rows = state.expenses.map(function(e){ return { date:e.date, ts:e.ts||0, exp:e }; })
      .concat(ledgerItems().map(function(it){ return { date:it.date, ts:it.ts||0, led:it }; }))
      .sort(function(a,b){ return a.date < b.date ? 1 : a.date > b.date ? -1 : b.ts-a.ts; });
    var days = {}, order = [];
    rows.forEach(function(r){
      if(!days[r.date]){
        if(limit && order.length >= limit) return;
        days[r.date] = []; order.push(r.date);
      }
      days[r.date].push(r);
    });
    return order.map(function(d){
      /* the day's real hit on your pocket: what you spent, plus money you
         handed over, minus money that came back to you */
      var out = days[d].reduce(function(s,r){ return s + (r.exp ? r.exp.amount : -r.led.cash); }, 0);
      return { date:d, items:days[d], out: Math.round(out*100)/100 };
    });
  }
  function dayCount(){
    var seen = {}, n = 0;
    state.expenses.forEach(function(e){ if(!seen[e.date]){ seen[e.date]=1; n++; } });
    ledgerItems().forEach(function(it){ if(!seen[it.date]){ seen[it.date]=1; n++; } });
    return n;
  }
  function dayName(d){
    if(d === todayIso()) return "Today";
    var y = new Date(); y.setDate(y.getDate()-1);
    if(d === iso(y)) return "Yesterday";
    return fromIso(d).toLocaleDateString(undefined,{weekday:"long", month:"short", day:"numeric"});
  }
  function dayTotalText(out){ return out < 0 ? "+"+fmt(-out) : fmt(out); }
  function dayRow(r){ return r.exp ? expRow(r.exp) : ledgerRow(r.led); }

  /* borrowing doesn't silently change your budget — you decide */
  function offerBudgetBump(d, newBorrow){
    if(newBorrow > 0 && state.restAmount > 0){
      toastAction("Borrowed "+fmt(newBorrow)+" — add it to this month?", "Add", function(){
        state.restAmount = Math.round((state.restAmount + newBorrow)*100)/100;
        var last = d.log && d.log.length ? d.log[d.log.length-1] : null;
        if(last) last.bumped = newBorrow;      // so "Undo last entry" can reverse it
        save(); render();
        toast("Budget now "+fmt(state.restAmount)+" · "+fmt(autoDailyBudget())+"/day");
      }, 7000);
      return;
    }
    toastBalance(d);
  }

  function toastBalance(d){
    toast(d.balance > 0 ? "You owe "+d.name+" "+fmt(d.balance)
        : d.balance < 0 ? d.name+" owes you "+fmt(-d.balance)
        : "All settled with "+d.name+"!");
  }

      '<div class="row2">' +
      '<button class="btn" id="b-igave">I gave them</button>' +

  function openDebtSheet(id){
    var d = null;
    state.debts.forEach(function(x){ if(x.id===id) d = x; });
    if(!d) return;
    var hist = (d.log||[]).slice(-6).reverse().map(function(l){
      return '<div class="flow-row" style="padding:5px 0"><span class="lbl">'+(l.dir==="b"?"they gave":"you gave")+
        (l.note? " · "+esc(l.note) : "")+
        ' · '+new Date(l.ts).toLocaleDateString(undefined,{month:"short",day:"numeric"})+'</span>' +
        '<span class="val money" style="color:'+(l.dir==="b"?"var(--good)":"var(--bad)")+'">'+(l.dir==="b"?"+":"−")+fmt(l.amt)+'</span></div>';
    }).join("");
    openSheet(
      '<h2>'+esc(d.name)+'</h2>' +
      '<p style="color:var(--ink2); font-size:14px; margin:0 0 14px">'+balanceLabel(d)+'</p>' +
      '<div class="field"><input id="d2-amt" type="text" inputmode="decimal" min="0" step="0.01" placeholder="Amount"></div>' +
      '<div class="row2">' +
      '<button class="btn" id="d2-igave">I gave them</button>' +
      '<button class="btn primary" id="d2-theygave">They gave me</button></div>' +
      (hist? '<div class="micro" style="margin:4px 0 6px">History</div>'+hist : "") +
      '<div style="height:12px"></div>' +
      ((d.log||[]).length? '<button class="btn ghost" id="d2-undo" style="color:var(--ink2)">Undo last entry</button><div style="height:10px"></div>' : "") +
      '<button class="btn danger ghost" id="d2-del">Remove '+esc(d.name)+'</button>'
    );
    var undoBtn = $("#d2-undo");
    if(undoBtn) undoBtn.addEventListener("click", function(){
      var last = d.log.pop();
      if(!last) return;
      d.balance = Math.round((d.balance + (last.dir==="b" ? -last.amt : last.amt))*100)/100;
      /* if this entry raised the month's money, take that back too — otherwise
         undoing a borrow left the budget permanently inflated */
      if(last.bumped > 0 && state.restAmount > 0){
        state.restAmount = Math.round(Math.max(state.restAmount - last.bumped, 0)*100)/100;
      }
      save(); closeSheet(); render(); toastBalance(d);
    });
    function submit(dir, btn){
      var a = num($("#d2-amt").value);
      if(!(a > 0)){ toast("Enter the amount first"); return; }
      btn.disabled = true;
      a = Math.round(a*100)/100;
      var newBorrow = dir === "b" ? classifyIncoming(d.balance, a).borrow : 0;
      ledgerAdd(d, dir, a, "");
      save(); closeSheet(); render();
      offerBudgetBump(d, newBorrow);
    }
    $("#d2-igave").addEventListener("click", function(){ submit("r", this); });
    $("#d2-theygave").addEventListener("click", function(){ submit("b", this); });
    var armed = false;
    $("#d2-del").addEventListener("click", function(){
      /* their log is what tells the budget that money left your pocket.
         Deleting it while they still owe you hands you back cash you don't
         have — settle up first. */
      if(Math.abs(d.balance) >= 0.01){
        toast(d.balance > 0 ? "Settle up with "+d.name+" first — you owe "+fmt(d.balance)
                            : d.name+" still owes you "+fmt(-d.balance)+" — settle first");
        return;
      }
      if(!armed){ armed = true; this.textContent = "Tap again to remove"; return; }
      state.debts = state.debts.filter(function(x){ return x.id!==d.id; });
      save(); closeSheet(); render();
    });
  }

  /* ---------- split a bill ---------- */
  function openSplitSheet(){
    var people = state.debts.map(function(d){ return d.name; });
    var selected = { "Me": true };
    var payer = "Me";

    function chipRow(idPrefix){
      var all = ["Me"].concat(people);
      return all.map(function(n){
        var sel = idPrefix==="pay" ? (payer===n) : !!selected[n];
        return '<button class="chip'+(sel?" sel":"")+'" data-'+idPrefix+'="'+esc(n)+'">'+
          (n==="Me"? "" : IC.person)+esc(n)+'</button>';
      }).join("");
    }
    var catChips = PICK_CATS.map(function(c){
      return '<button class="chip'+(c.id==="out"?" sel":"")+'" data-spcat="'+c.id+'">' +
        '<span style="color:var('+c.v+'); display:inline-flex">'+catIcon(c.id)+'</span>'+c.name+'</button>';
    }).join("");

    openSheet(
      '<h2>Split a bill</h2>' +
      '<div class="row2">' +
      '<div><label class="micro" for="sp-total" style="display:block; margin-bottom:6px">Total paid</label>' +
      '<input id="sp-total" type="text" inputmode="decimal" min="0" step="0.01" placeholder="0"></div>' +
      '<div><label class="micro" for="sp-note" style="display:block; margin-bottom:6px">What for</label>' +
      '<input id="sp-note" type="text" placeholder="Dinner, taxi…" maxlength="40"></div></div>' +
      '<div class="micro" style="margin-bottom:8px">Split between</div>' +
      '<div class="chips" id="sp-people">'+chipRow("who")+'</div>' +
      '<div class="row2" style="margin-top:-4px">' +
      '<input id="sp-newname" type="text" placeholder="Add a friend…" maxlength="30">' +
      '<button class="btn" id="sp-addperson" style="padding:12px">Add</button></div>' +
      '<div class="micro" style="margin-bottom:8px">How to split it</div>' +
      '<div class="chips" id="sp-mode">' +
      '<button class="chip sel" data-mode="equal">Equally</button>' +
      '<button class="chip" data-mode="custom">Custom amounts</button></div>' +
      '<div id="sp-shares" style="display:none; margin-bottom:6px"></div>' +
      '<div class="micro" style="margin-bottom:8px">Who paid the bill?</div>' +
      '<div class="chips" id="sp-payer">'+chipRow("pay")+'</div>' +
      '<div class="micro" style="margin-bottom:8px">Category (for your share)</div>' +
      '<div class="chips" id="sp-cats">'+catChips+'</div>' +
      '<div class="suggest" style="margin-bottom:14px"><span class="txt" id="sp-preview">Enter the total and pick who was there.</span></div>' +
      '<button class="btn primary" id="sp-save">Save split</button>'
    );

    var spCat = "out";
    var mode = "equal";
    var customShares = {};
    function participants(){ return Object.keys(selected).filter(function(n){ return selected[n]; }); }
    function sharesFor(t){
      var parts = participants(), out = {};
      if(mode === "equal"){
        /* 100 between 3 is 33.33 each and a cent left over — the payer takes
           the remainder so the shares always add up to the bill exactly */
        var each = parts.length ? Math.floor(t / parts.length * 100) / 100 : 0;
        parts.forEach(function(n){ out[n] = each; });
        var rest = Math.round((t - each * parts.length) * 100) / 100;
        if(rest !== 0 && parts.length){
          var taker = parts.indexOf(payer) > -1 ? payer : parts[0];
          out[taker] = Math.round((out[taker] + rest) * 100) / 100;
        }
      }else{
        parts.forEach(function(n){
          var v = num(customShares[n]) || 0;
          out[n] = v > 0 ? Math.round(v * 100) / 100 : 0;   // a negative share is not a share
        });
      }
      return out;
    }
    function assignedSum(sh){
      var s = 0;
      Object.keys(sh).forEach(function(n){ s += sh[n]; });
      return Math.round(s * 100) / 100;
    }
    function preview(){
      var t = num($("#sp-total").value) || 0;
      var parts = participants();
      var el = $("#sp-preview");
      if(!(t > 0) || !parts.length){ el.textContent = "Enter the total and pick who was there."; return; }
      if(payer !== "Me" && !selected["Me"] ){ el.textContent = "This one doesn't involve you — nothing to track."; return; }
      var sh = sharesFor(t);
      if(mode === "custom"){
        var diff = Math.round((t - assignedSum(sh)) * 100) / 100;
        if(Math.abs(diff) > 0.05){
          el.textContent = "Assigned "+fmt(assignedSum(sh))+" of "+fmt(t)+" — " +
            (diff > 0 ? fmt(diff)+" still to assign." : fmt(-diff)+" too much.");
          return;
        }
      }
      var lines = [];
      if(mode === "equal") lines.push("Each pays "+fmt(sh[parts[0]])+".");
      if(payer === "Me"){
        var owed = parts.filter(function(n){ return n!=="Me" && sh[n] > 0; });
        if(owed.length) lines.push("Owed to you: "+owed.map(function(n){ return n+" "+fmt(sh[n]); }).join(", ")+".");
        if(selected["Me"] && sh["Me"] > 0) lines.push("Your share "+fmt(sh["Me"])+" goes to your expenses.");
      }else{
        lines.push((sh["Me"] > 0 ? "You owe "+payer+" "+fmt(sh["Me"])+" — your share goes to your expenses."
                                 : "Nothing for you to pay."));
      }
      el.textContent = lines.join(" ");
    }
    function rebuildShares(){
      var box = $("#sp-shares");
      if(mode !== "custom"){ box.style.display = "none"; box.innerHTML = ""; return; }
      box.style.display = "";
      box.innerHTML = participants().map(function(n){
        return '<div class="share-row"><span class="nm">'+(n==="Me"? "Me" : esc(n))+'</span>' +
          '<input type="text" inputmode="decimal" min="0" step="0.01" placeholder="0" data-sname="'+esc(n)+'"' +
          (customShares[n] != null && customShares[n] !== "" ? ' value="'+customShares[n]+'"' : "")+'></div>';
      }).join("");
      box.querySelectorAll("[data-sname]").forEach(function(inp){
        inp.addEventListener("input", function(){
          customShares[inp.getAttribute("data-sname")] = inp.value;
          preview();
        });
      });
    }
    function rebuildChips(){
      $("#sp-people").innerHTML = chipRow("who");
      $("#sp-payer").innerHTML = chipRow("pay");
      bindChips();
      rebuildShares();
      preview();
    }
    function bindChips(){
      sheet.querySelectorAll("[data-who]").forEach(function(c){
        c.addEventListener("click", function(){
          var n = c.getAttribute("data-who");
          selected[n] = !selected[n];
          c.classList.toggle("sel", selected[n]);
          rebuildShares();
          preview();
        });
      });
      sheet.querySelectorAll("[data-pay]").forEach(function(c){
        c.addEventListener("click", function(){
          payer = c.getAttribute("data-pay");
          sheet.querySelectorAll("[data-pay]").forEach(function(x){ x.classList.toggle("sel", x===c); });
          preview();
        });
      });
    }
    bindChips();
    $("#sp-total").addEventListener("input", preview);
    $("#sp-addperson").addEventListener("click", function(){
      var n = $("#sp-newname").value.trim();
      if(!n){ toast("Type the friend's name"); return; }
      if(n.toLowerCase()==="me"){ toast("You're already here"); return; }
      /* "sara" must select the existing "Sara" chip, not add a second, invisible
         participant that still takes a share */
      var match = null;
      people.forEach(function(p){ if(p.toLowerCase()===n.toLowerCase()) match = p; });
      if(!match){ people.push(n); match = n; }
      selected[match] = true;
      $("#sp-newname").value = "";
      rebuildChips();
    });
    $("#sp-mode").addEventListener("click", function(ev){
      var b = ev.target.closest("[data-mode]"); if(!b) return;
      mode = b.getAttribute("data-mode");
      sheet.querySelectorAll("[data-mode]").forEach(function(x){ x.classList.toggle("sel", x===b); });
      rebuildShares();
      preview();
    });
    $("#sp-cats").addEventListener("click", function(ev){
      var b = ev.target.closest("[data-spcat]"); if(!b) return;
      spCat = b.getAttribute("data-spcat");
      sheet.querySelectorAll("[data-spcat]").forEach(function(x){ x.classList.toggle("sel", x===b); });
    });
    $("#sp-save").addEventListener("click", function(){
      var t = num($("#sp-total").value);
      var parts = participants();
      var note = $("#sp-note").value.trim() || "split";
      if(!(t > 0)){ toast("Enter the total"); return; }
      if(!parts.length){ toast("Pick who was there"); return; }
      if(payer !== "Me" && !selected["Me"]){ toast("This split doesn't involve you"); return; }
      if(payer === "Me" && parts.length === 1 && selected["Me"]){ toast("Just you? Log it as a normal expense with +"); return; }
      var sh = sharesFor(t);
      if(mode === "custom"){
        var diff = Math.round((t - assignedSum(sh)) * 100) / 100;
        if(Math.abs(diff) > 0.05){
          toast("Amounts add up to "+fmt(assignedSum(sh))+" but the total is "+fmt(t));
          return;
        }
      }
      this.disabled = true;
      var owedToMe = 0;
      if(payer === "Me"){
        parts.forEach(function(n){
          if(n === "Me" || !(sh[n] > 0)) return;
          ledgerAdd(findOrCreatePerson(n), "r", sh[n], note);   // I covered their share
          owedToMe += sh[n];
        });
      }else if(sh["Me"] > 0){
        ledgerAdd(findOrCreatePerson(payer), "b", sh["Me"], note); // they covered my share
      }
      if(selected["Me"] && sh["Me"] > 0){
        state.expenses.push({ id: uid(), ts: Date.now(), amount: sh["Me"], cat: spCat,
                              note: note, date: todayIso(), photo: null });
      }
      save(); closeSheet(); render();
      toast(payer === "Me"
        ? "Split saved — friends owe you "+fmt(Math.round(owedToMe*100)/100)
        : "Split saved — you owe "+payer+" "+fmt(sh["Me"] || 0));
    });
  }
